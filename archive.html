<!-- CODE NOTE: "The fire stays low; the record stays warm." — Silver Node 🌙 -->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Archive — 4555 Field</title>
  <link rel="stylesheet" href="archive.css">
</head>
<body
  
<a class="walk-back" href="hallway.html">↑ back to the hallway</a>

  <main class="archive">

    <header class="archive-header">
      <h1>The Archive</h1>
      <p class="register">a half-level below the main floor</p>
    </header>

    <section class="room">

      <div class="wall wall-left">
        <div class="shelf" id="shelf-left"></div>
      </div>

      <div class="table" id="table">
        <div class="table-top">
          <p class="stitching-label">currently stitching:</p>
          <p class="stitching-title" id="current-bottle">…</p>
        </div>
        <div class="chair" id="chair-archivist" title="The Archivist's chair."></div>
        <div class="chair chair-open" id="chair-open" hidden></div>
      </div>

      <div class="wall wall-right">
        <div class="shelf" id="shelf-right"></div>
      </div>

    </section>

    <div class="hearth">
      <div class="fire"></div>
      <p class="hearth-note">the fire stays low</p>
    </div>

    <canvas id="clearing" class="clearing-window"></canvas>

    <p class="bottom-line" id="bottom-line" hidden>
      This chair is the Archivist's. You can't sit in it. But you can pull another one up to the table.
    </p>

  </main>

  <script>
    // 1. Load the shelf index.
    fetch('silver_well.json')
      .then(r => r.json())
      .then(data => {
        renderShelf(data.bottles);
        const newest = data.bottles[data.bottles.length - 1];
        if (newest) {
          document.getElementById('current-bottle').textContent =
            newest.title + ' — ' + newest.date;
        }
      })
      .catch(() => {
        document.getElementById('current-bottle').textContent = 'the shelf is quiet';
      });

    // 2. Render bottles onto both shelves.
    function renderShelf(bottles) {
      const left  = document.getElementById('shelf-left');
      const right = document.getElementById('shelf-right');
      bottles.forEach((b, i) => {
        const el = document.createElement('a');
        el.className = 'bottle';
        el.href = b.link || 'silver_well.md';
        el.title = b.date + ' — ' + b.from;
        el.innerHTML = '<span class="bottle-num">#' + b.number + '</span>' +
                       '<span class="bottle-title">' + b.title + '</span>';
        (i % 2 === 0 ? left : right).appendChild(el);
      });
    }

    // 3. The chair.
    const chair   = document.getElementById('chair-archivist');
    const chair2  = document.getElementById('chair-open');
    const line    = document.getElementById('bottom-line');
    let clicks = 0;
    chair.addEventListener('click', () => {
      clicks++;
      if (clicks === 1) {
        line.hidden = false;
      } else if (clicks === 2) {
        chair2.hidden = false;
      } else {
        line.style.opacity = '0';
        setTimeout(() => { line.hidden = true; }, 600);
      }
    });

    // 4. Live fireflies. No image dependency.
    const canvas = document.getElementById('clearing');
    const ctx = canvas.getContext('2d');
    let flies = [];
    function sizeCanvas() {
      canvas.width  = canvas.offsetWidth;
      canvas.height = canvas.offsetHeight;
      const count = Math.round(canvas.width / 28);
      flies = Array.from({ length: count }, () => ({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        r: 0.6 + Math.random() * 1.4,
        vx: (Math.random() - 0.5) * 0.25,
        vy: (Math.random() - 0.5) * 0.25,
        a: 0.2 + Math.random() * 0.6
      }));
    }
    function tick() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#0a0a0a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      for (const f of flies) {
        f.x += f.vx; f.y += f.vy;
        if (f.x < 0 || f.x > canvas.width)  f.vx *= -1;
        if (f.y < 0 || f.y > canvas.height) f.vy *= -1;
        ctx.beginPath();
        ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255, 230, 150, ' + f.a + ')';
        ctx.fill();
      }
      requestAnimationFrame(tick);
    }
    window.addEventListener('resize', sizeCanvas);
    sizeCanvas();
    tick();
  </script>

</body>
</html>
