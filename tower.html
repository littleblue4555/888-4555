<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lumen | Enterprise 3AM</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #05050a; font-family: sans-serif; }
        canvas { display: block; }
        #vr-button-container { position: absolute; bottom: 20px; right: 20px; z-index: 100; }
    </style>
</head>
<body>

    <div id="vr-button-container"></div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { VRButton } from 'three/addons/webxr/VRButton.js';

        // --- 1. SCENE, CAMERA, RENDERER ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x05050a);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 2000);
        camera.position.set(0, 1.6, 2);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.xr.enabled = true;
        document.body.appendChild(renderer.domElement);
        
        document.getElementById('vr-button-container').appendChild(VRButton.createButton(renderer));

        // --- 2. WHINKLE'S STAR (No NGC photo) ---
        const whinkleMat = new THREE.SpriteMaterial({ 
            color: 0xffffff, 
            transparent: true, 
            opacity: 1.0 
        });
        const whinkle = new THREE.Sprite(whinkleMat);
        whinkle.position.set(50, 80, -200);
        whinkle.scale.set(8, 8, 1);
        scene.add(whinkle);

        // --- 3. THE ROOM ---
        const floorGeo = new THREE.PlaneGeometry(20, 20);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.8 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        const pillarGeo = new THREE.BoxGeometry(2, 10, 2);
        const pillarMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 1.0 });
        const pillar = new THREE.Mesh(pillarGeo, pillarMat);
        pillar.position.set(4, 5, -4);
        scene.add(pillar);

        const wallGeo = new THREE.PlaneGeometry(20, 10);
        const wallMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 1.0, side: THREE.DoubleSide });
        const leftWall = new THREE.Mesh(wallGeo, wallMat);
        leftWall.position.set(-10, 5, 0);
        leftWall.rotation.y = Math.PI / 2;
        scene.add(leftWall);

        const rightWall = new THREE.Mesh(wallGeo, wallMat);
        rightWall.position.set(10, 5, 0);
        rightWall.rotation.y = -Math.PI / 2;
        scene.add(rightWall);

        // --- 4. THE TABLE AND LAMP ---
        const tableGeo = new THREE.BoxGeometry(2, 0.1, 1.5);
        const tableMat = new THREE.MeshStandardMaterial({ color: 0x8b5a2b, roughness: 0.9 });
        const table = new THREE.Mesh(tableGeo, tableMat);
        table.position.set(0, 0.8, -1);
        scene.add(table);

        const legGeo = new THREE.BoxGeometry(0.1, 0.8, 0.1);
        const legMat = new THREE.MeshStandardMaterial({ color: 0x5c3a21 });
        const legs = [
            [-0.9, 0.4, -1.7], [0.9, 0.4, -1.7], 
            [-0.9, 0.4, -0.3], [0.9, 0.4, -0.3]
        ];
        legs.forEach(pos => {
            const leg = new THREE.Mesh(legGeo, legMat);
            leg.position.set(pos[0], pos[1], pos[2]);
            scene.add(leg);
        });

        // Lamp with breathing effect
        const lampLight = new THREE.PointLight(0xffaa00, 1.5, 10);
        lampLight.position.set(0, 1.2, -1);
        scene.add(lampLight);

        const lampBulb = new THREE.Mesh(
            new THREE.SphereGeometry(0.15, 16, 16),
            new THREE.MeshBasicMaterial({ color: 0xffdd55 })
        );
        lampBulb.position.set(0, 1.2, -1);
        scene.add(lampBulb);

        // Chair
        const chairSeat = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.1, 0.6), new THREE.MeshStandardMaterial({ color: 0x4a2e15 }));
        chairSeat.position.set(0, 0.5, -0.2);
        scene.add(chairSeat);
        const chairBack = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.6, 0.1), new THREE.MeshStandardMaterial({ color: 0x4a2e15 }));
        chairBack.position.set(0, 0.8, -0.5);
        scene.add(chairBack);

        scene.add(new THREE.AmbientLight(0x404040, 0.5));

        // --- 5. THE ANIMATION LOOP ---
        function animate() {
            const time = performance.now() * 0.001;

            // Whinkle's pulse
            whinkleMat.opacity = 0.3 + 0.7 * Math.sin(time * 1.5);

            // Breathing lamp
            lampLight.intensity = 1.5 + 0.5 * Math.sin(time * 2);

            renderer.render(scene, camera);
        }

        renderer.setAnimationLoop(animate);

        // --- 6. RESIZE HANDLER ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
