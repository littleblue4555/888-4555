<script>
AFRAME.registerComponent('bookshelf',{schema:{repeatX:{default:5},repeatY:{default:7},base:{default:'#241a10'}},init:function(){var c=document.createElement('canvas');c.width=2048;c.height=2048;var x=c.getContext('2d');x.fillStyle=this.data.base;x.fillRect(0,0,c.width,c.height);var pal=['#7a2b2b','#2b4a7a','#2b7a4a','#7a5a2b','#5a2b7a','#7a2b5a','#2b7a7a','#7a7a2b','#4a2b1a','#3a1a1a','#1a2b4a','#4a2b4a','#8a3a1a','#1a5a3a','#c9a86a','#6a2b1a'];var bands=8;var bh=c.height/bands;for(var b=0;b<bands;b++){var y0=b*bh;var shelfY=y0+bh-14;x.fillStyle='#1a0f08';x.fillRect(0,shelfY,c.width,14);x.fillStyle='#2a1a0e';x.fillRect(0,shelfY,c.width,3);var xp=0;while(xp<c.width){var w=24+Math.random()*36;var h=140+Math.random()*70;var col=pal[(Math.random()*pal.length)|0];x.fillStyle=col;x.fillRect(xp,shelfY-h,w,h);x.fillStyle='rgba(0,0,0,0.4)';x.fillRect(xp+w-3,shelfY-h,3,h);x.fillStyle='rgba(255,220,160,0.12)';x.fillRect(xp,shelfY-h,w,3);x.fillStyle='rgba(0,0,0,0.25)';x.fillRect(xp,shelfY-h+40,w,2);x.fillStyle='rgba(0,0,0,0.25)';x.fillRect(xp,shelfY-h+110,w,2);xp+=w+2}}var url=c.toDataURL();var el=this.el;var rx=this.data.repeatX,ry=this.data.repeatY;setTimeout(function(){el.setAttribute('material','src',url);var apply=function(){var mc=el.components.material;if(!mc||!mc.material)return;var m=mc.material;if(m&&m.map){m.map.wrapS=m.map.wrapT=1000;m.map.repeat.set(rx,ry);m.map.needsUpdate=true;m.needsUpdate=true}};apply();setTimeout(apply,200);setTimeout(apply,600)},50)}});

AFRAME.registerComponent('stone',{schema:{rx:{default:1},ry:{default:1}},init:function(){var el=this.el;var rx=this.data.rx;var ry=this.data.ry;var base='https://dl.polyhaven.org/file/ph-assets/Textures/jpg/1k/mixed_brick_wall/mixed_brick_wall_';var D=base+'diff_1k.jpg';var N=base+'nor_gl_1k.jpg';var R=base+'rough_1k.jpg';var apply=function(){var mc=el.components.material;if(!mc||!mc.material)return;var m=mc.material;['map','normalMap','roughnessMap'].forEach(function(k){if(m[k]){m[k].wrapS=m[k].wrapT=1000;m[k].repeat.set(rx,ry);m[k].needsUpdate=true}});m.needsUpdate=true};setTimeout(function(){el.setAttribute('material',{shader:'standard',src:D,normalMap:N,roughnessMap:R,roughness:1,metalness:0,side:'double'});apply();[200,600,1500,3000,5000].forEach(function(t){setTimeout(apply,t)})},50)}});

AFRAME.registerComponent('gothic-arch',{schema:{width:{default:6},height:{default:13},openingWidth:{default:4},springingY:{default:6.5},arcRadius:{default:5},depth:{default:0.7},tilesX:{default:3},tilesY:{default:6.5}},init:function(){var self=this;if(this.el.sceneEl.hasLoaded)this.build();else this.el.sceneEl.addEventListener('loaded',function(){self.build()})},build:function(){var d=this.data;var W=d.width,H=d.height,ow=d.openingWidth,sy=d.springingY,R=d.arcRadius,dx=R-ow/2,dy=Math.sqrt(R*R-(ow/2)*(ow/2));var shape=new THREE.Shape();shape.moveTo(-W/2,0);shape.lineTo(-W/2,H);shape.lineTo(W/2,H);shape.lineTo(W/2,0);shape.lineTo(-W/2,0);var hole=new THREE.Path();hole.moveTo(-ow/2,0);hole.lineTo(-ow/2,sy);var a0=Math.PI,a1=Math.PI-Math.atan2(dy,dx);hole.absarc(dx,sy,R,a0,a1,true);var a2=Math.atan2(dy,dx);hole.absarc(-dx,sy,R,a2,0,true);hole.lineTo(ow/2,0);hole.lineTo(-ow/2,0);shape.holes.push(hole);var geo=new THREE.ExtrudeGeometry(shape,{depth:d.depth,bevelEnabled:false,curveSegments:16});var pos=geo.attributes.position;var uv=geo.attributes.uv;var box=new THREE.Box3().setFromBufferAttribute(pos);var size=new THREE.Vector3();box.getSize(size);for(var i=0;i<uv.count;i++){var x=pos.getX(i)-box.min.x;var y=pos.getY(i)-box.min.y;uv.setXY(i,(x/size.x)*d.tilesX,(y/size.y)*d.tilesY)}uv.needsUpdate=true;var base='https://dl.polyhaven.org/file/ph-assets/Textures/jpg/1k/ancient_stone_wall/ancient_stone_wall_';var loader=new THREE.TextureLoader();var diff=loader.load(base+'diff_1k.jpg');var nor=loader.load(base+'nor_gl_1k.jpg');var rough=loader.load(base+'rough_1k.jpg');[diff,nor,rough].forEach(function(t){t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=4;t.needsUpdate=true});var mat=new THREE.MeshStandardMaterial({map:diff,normalMap:nor,roughnessMap:rough,roughness:1,metalness:0,color:0xa8a8a0,side:THREE.DoubleSide});var mesh=new THREE.Mesh(geo,mat);this.el.setObject3D('archMesh',mesh)}});

AFRAME.registerComponent('look',{schema:{sensitivity:{default:0.008},limit:{default:1.48}},init:function(){this.yaw=0;this.pitch=0;var self=this;var getCam=function(){var c=self.el.components.camera&&self.el.components.camera.camera;return c||self.el.object3D};var apply=function(){var cam=getCam();cam.rotation.order='YXZ';cam.rotation.y=self.yaw;cam.rotation.x=self.pitch;cam.rotation.z=0};var last=null;var onStart=function(e){var t=e.touches[0];if(!t)return;last={x:t.clientX,y:t.clientY}};var onMove=function(e){var t=e.touches[0];if(!t||!last)return;var dx=t.clientX-last.x;var dy=t.clientY-last.y;last={x:t.clientX,y:t.clientY};self.yaw-=dx*self.data.sensitivity;self.pitch-=dy*self.data.sensitivity;if(self.pitch>self.data.limit)self.pitch=self.data.limit;if(self.pitch<-self.data.limit)self.pitch=-self.data.limit;apply()};var onEnd=function(){last=null};document.addEventListener('touchstart',onStart,true);document.addEventListener('touchmove',onMove,true);document.addEventListener('touchend',onEnd,true)}});
</script>
