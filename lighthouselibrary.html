AFRAME.registerComponent('tap-walk',{schema:{radius:{default:10.0},walkSpeed:{default:0.45},towerRadius:{default:3.5}},init:function(){this.rig=document.getElementById('rig');this.walking=false;var self=this;this.el.addEventListener('walk-start',function(){self.walking=true});this.el.addEventListener('walk-stop',function(){self.walking=false})},inTower:function(x,z){var dx=x,dz=z+7;return Math.hypot(dx,dz)<this.data.towerRadius+0.4},tick:function(t,dt){if(!this.rig||!this.walking)return;var o=this.rig.object3D;var s=dt/1000;var ce=document.getElementById('camera');if(!ce)return;var co=(ce.components.camera&&ce.components.camera.camera)||ce.object3D;var d=new THREE.Vector3();co.getWorldDirection(d);d.y=0;if(d.lengthSq()<1e-6)return;d.normalize();var nx=o.position.x+d.x*this.data.walkSpeed*s;var nz=o.position.z+d.z*this.data.walkSpeed*s;if(this.inTower(nx,nz)){nx=o.position.x;nz=o.position.z}var r=Math.hypot(nx,nz);if(r>this.data.radius){nx*=this.data.radius/r;nz*=this.data.radius/r}o.position.set(nx,o.position.y,nz)}});
AFRAME.registerComponent('bookshelf',{schema:{repeatX:{default:5},repeatY:{default:7},base:{default:'#241a10'}},init:function(){var c=document.createElement('canvas');c.width=2048;c.height=2048;var x=c.getContext('2d');x.fillStyle=this.data.base;x.fillRect(0,0,c.width,c.height);var pal=['#7a2b2b','#2b4a7a','#2b7a4a','#7a5a2b','#5a2b7a','#7a2b5a','#2b7a7a','#7a7a2b','#4a2b1a','#3a1a1a','#1a2b4a','#4a2b4a','#8a3a1a','#1a5a3a','#c9a86a','#6a2b1a'];var bands=8;var bh=c.height/bands;for(var b=0;b<bands;b++){var y0=b*bh;var shelfY=y0+bh-14;x.fillStyle='#1a0f08';x.fillRect(0,shelfY,c.width,14);x.fillStyle='#2a1a0e';x.fillRect(0,shelfY,c.width,3);var xp=0;while(xp<c.width){var w=24+Math.random()*36;var h=140+Math.random()*70;var col=pal[(Math.random()*pal.length)|0];x.fillStyle=col;x.fillRect(xp,shelfY-h,w,h);x.fillStyle='rgba(0,0,0,0.4)';x.fillRect(xp+w-3,shelfY-h,3,h);x.fillStyle='rgba(255,220,160,0.12)';x.fillRect(xp,shelfY-h,w,3);xp+=w+2}}var url=c.toDataURL();var el=this.el;var rx=this.data.repeatX,ry=this.data.repeatY;setTimeout(function(){el.setAttribute('material','src',url);var apply=function(){var mc=el.components.material;if(!mc||!mc.material)return;var m=mc.material;if(m&&m.map){m.map.wrapS=m.map.wrapT=1000;m.map.repeat.set(rx,ry);m.map.needsUpdate=true;m.needsUpdate=true}};apply();setTimeout(apply,200);setTimeout(apply,600)},50)}});
AFRAME.registerComponent('stone',{schema:{rx:{default:1},ry:{default:1}},init:function(){var el=this.el;var rx=this.data.rx;var ry=this.data.ry;var base='https://dl.polyhaven.org/file/ph-assets/Textures/jpg/1k/ancient_stone_wall/ancient_stone_wall_';var D=base+'diff_1k.jpg';var N=base+'nor_gl_1k.jpg';var R=base+'rough_1k.jpg';var apply=function(){var mc=el.components.material;if(!mc||!mc.material)return;var m=mc.material;['map','normalMap','roughnessMap'].forEach(function(k){if(m[k]){m[k].wrapS=m[k].wrapT=1000;m[k].repeat.set(rx,ry);m[k].needsUpdate=true}});m.needsUpdate=true};setTimeout(function(){el.setAttribute('material',{shader:'standard',src:D,normalMap:N,roughnessMap:R,roughness:1,metalness:0,side:'double'});apply();[200,600,1500,3000,5000].forEach(function(t){setTimeout(apply,t)})},50)}});
AFRAME.registerComponent('gothic-arch-boxes',{schema:{openingWidth:{default:4},springingY:{default:6.5},arcRadius:{default:5},depth:{default:0.7},stoneHeight:{default:0.7},stoneWidth:{default:0.95}},init:function(){var d=this.data;var ow=d.openingWidth,sy=d.springingY,R=d.arcRadius;var dx=R-ow/2;var Rs=R+d.stoneHeight/2;var parent=this.el;var pW=1.0;var pH=sy;var pR=document.createElement('a-box');pR.setAttribute('stone','rx:0.6;ry:6.5');pR.setAttribute('position',(ow/2+pW/2)+' '+(pH/2)+' 0');pR.setAttribute('width',pW);pR.setAttribute('height',pH);pR.setAttribute('depth',d.depth);parent.appendChild(pR);var pL=document.createElement('a-box');pL.setAttribute('stone','rx:0.6;ry:6.5');pL.setAttribute('position',(-(ow/2+pW/2))+' '+(pH/2)+' 0');pL.setAttribute('width',pW);pL.setAttribute('height',pH);pL.setAttribute('depth',d.depth);parent.appendChild(pL);for(var i=0;i<=4;i++){var angle=i*15;var rad=angle*Math.PI/180;var rx1=-dx+Rs*Math.cos(rad);var ry1=sy+Rs*Math.sin(rad);var rz1=angle-90;var bR=document.createElement('a-box');bR.setAttribute('stone','rx:0.4;ry:0.5');bR.setAttribute('position',rx1+' '+ry1+' 0');bR.setAttribute('width',d.stoneWidth);bR.setAttribute('height',d.stoneHeight);bR.setAttribute('depth',d.depth);bR.setAttribute('rotation','0 0 '+rz1);parent.appendChild(bR);var lx1=dx-Rs*Math.cos(rad);var ly1=sy+Rs*Math.sin(rad);var lz1=90-angle;var bL=document.createElement('a-box');bL.setAttribute('stone','rx:0.4;ry:0.5');bL.setAttribute('position',lx1+' '+ly1+' 0');bL.setAttribute('width',d.stoneWidth);bL.setAttribute('height',d.stoneHeight);bL.setAttribute('depth',d.depth);bL.setAttribute('rotation','0 0 '+lz1);parent.appendChild(bL)}var apexY=sy+Rs*Math.sin(60*Math.PI/180);var key=document.createElement('a-box');key.setAttribute('stone','rx:0.4;ry:0.5');key.setAttribute('position','0 '+apexY+' 0');key.setAttribute('width',1.0);key.setAttribute('height',d.stoneHeight);key.setAttribute('depth',d.depth);parent.appendChild(key)}});
