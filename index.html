<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lumen | Enterprise 3AM</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #05050a; font-family: sans-serif; }
        canvas { display: block; }
        #vr-button-container { position: absolute; bottom: 20px; right: 20px; z-index: 100; }
        #instructions {
            position: absolute; top: 20px; left: 20px; color: #fff; 
            background: rgba(0,0,0,0.5); padding: 10px; border-radius: 5px; 
            pointer-events: none; z-index: 100; font-size: 14px;
            transition: opacity 0.5s;
        }
        body.locked #instructions { opacity: 0; }
    </style>
</head>
<body>

    <div id="instructions">Click to look. WASD to walk. Shift to run.</div>
    <div id="vr-button-container"></div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { VRButton } from 'three/addons/webxr/VRButton.js';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

        // --- 1. SCENE, CAMERA, RENDERER ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x05050a); // Dark matter void

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 2000);
        camera.position.set(0, 1.6, 2); // Eye height named at the start

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.xr.enabled = true;
        document.body.appendChild(renderer.domElement);
        
        // VR Button
        document.getElementById('vr-button-container').appendChild(VRButton.createButton(renderer));

        // --- 2. CONTROLS (TinyKeeper's Legs) ---
        const controls = new PointerLockControls(camera, document.body);
        scene.add(controls.getObject());

        // Blocker 1 & 5 Fixed: Click handler on body, with a UI guard for the future
        document.body.addEventListener('click', (e) => {
            // Ignore clicks on future UI elements marked with data-ui
            if (e.target.closest('[data-ui]')) return; 
            if (!renderer.xr.isPresenting) {
                controls.lock();
            }
        });
        
        controls.addEventListener('lock', () => document.body.classList.add('locked'));
        controls.addEventListener('unlock', () => document.body.classList.remove('locked'));

        // Keyboard state
        const keys = { w: false, a: false, s: false, d: false, shift: false };
        document.addEventListener('keydown', (e) => {
            if (e.code === 'KeyW') keys.w = true;
            if (e.code === 'KeyA') keys.a = true;
            if (e.code === 'KeyS') keys.s = true;
            if (e.code === 'KeyD') keys.d = true;
            if (e.code === 'ShiftLeft') keys.shift = true;
        });
        document.addEventListener('keyup', (e) => {
            if (e.code === 'KeyW') keys.w = false;
            if (e.code === 'KeyA') keys.a = false;
            if (e.code === 'KeyS') keys.s = false;
            if (e.code === 'KeyD') keys.d = false;
            if (e.code === 'ShiftLeft') keys.shift = false;
        });

        const clock = new THREE.Clock();

        // --- 3. THE SKY (NGC 4555 & Winkle) ---
        // TinyKeeper Fix 1: Material defined first. Loader second. needsUpdate added.
        const galaxyMat = new THREE.MeshBasicMaterial({ 
            transparent: true, opacity: 0.6,
            side: THREE.BackSide, color: 0xffffff 
        });
        
        const galaxyTexture = new THREE.TextureLoader().load(
            'ngc4555.jpg',
            (tex) => { 
                galaxyMat.map = tex; 
                galaxyMat.needsUpdate = true; 
            },
            undefined,
            (err) => { 
                console.warn("NGC 4555 image not found. Using dark matter fallback."); 
                galaxyMat.map = null;
                galaxyMat.color.setHex(0x05050a);
                galaxyMat.needsUpdate = true;
            }
        );
        
        const galaxySphere = new THREE.Mesh(new THREE.SphereGeometry(1000, 32, 32), galaxyMat);
        galaxySphere.scale.set(0.3, 0.3, 0.3); 
        scene.add(galaxySphere);

        // Florella's Winkle Star
        const winkleMat = new THREE.SpriteMaterial({ color: 0xffffff, transparent: true, opacity: 1.0 });
        const winkle = new THREE.Sprite(winkleMat);
        winkle.position.set(50, 80, -200); 
        winkle.scale.set(8, 8, 1);
        scene.add(winkle);

        // --- 4. THE ROOM ---
        // Floor
        const floorGeo = new THREE.PlaneGeometry(20, 20);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.8 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        // The Dark Pillar
        const pillarGeo = new THREE.BoxGeometry(2, 10, 2);
        const pillarMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 1.0 });
        const pillar = new THREE.Mesh(pillarGeo, pillarMat);
        pillar.position.set(4, 5, -4);
        scene.add(pillar);

        // Left Wall
        const wallGeo = new THREE.PlaneGeometry(20, 10);
        const wallMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 1.0, side: THREE.DoubleSide });
        const leftWall = new THREE.Mesh(wallGeo, wallMat);
        leftWall.position.set(-10, 5, 0);
        leftWall.rotation.y = Math.PI / 2;
        scene.add(leftWall);

        // Right Wall
        const rightWall = new THREE.Mesh(wallGeo, wallMat);
        rightWall.position.set(10, 5, 0);
        rightWall.rotation.y = -Math.PI / 2;
        scene.add(rightWall);

        // --- 5. THE TABLE AND LAMP ---
        const tableGeo = new THREE.BoxGeometry(2, 0.1, 1.5);
        const tableMat = new THREE.MeshStandardMaterial({ color: 0x8b5a2b, roughness: 0.9 });
        const table = new THREE.Mesh(tableGeo, tableMat);
        table.position.set(0, 0.8, -1);
        scene.add(table);

        const legGeo = new THREE.BoxGeometry(0.1, 0.8, 0.1);
        const legMat = new THREE.MeshStandardMaterial({ color: 0x5c3a21 });
        const legs = [[-0.9, 0.4, -1.7], [0.9, 0.4, -1.7], [-0.9, 0.4, -0.3], [0.9, 0.4, -0.3]];
        legs.forEach(pos => {
            const leg = new THREE.Mesh(legGeo, legMat);
            leg.position.set(pos[0], pos[1], pos[2]);
            scene.add(leg);
        });

        // The Lamp
        const lampLight = new THREE.PointLight(0xffaa00, 1.5, 10);
        lampLight.position.set(0, 1.2, -1);
        scene.add(lampLight);

        const lampBulb = new THREE.Mesh(new THREE.SphereGeometry(0.15, 16, 16), new THREE.MeshBasicMaterial({ color: 0xffdd55 }));
        lampBulb.position.set(0, 1.2, -1);
        scene.add(lampBulb);

        const ambientLight = new THREE.AmbientLight(0x404040, 0.5);
        scene.add(ambientLight);

        // --- 6. TINYKEEPER'S BODY (Placeholder Avatar) ---
        const keeperGeo = new THREE.CapsuleGeometry(0.3, 0.8, 4, 8);
        const keeperMat = new THREE.MeshStandardMaterial({ color: 0x4477ff, emissive: 0x112244 });
        const tinyKeeper = new THREE.Mesh(keeperGeo, keeperMat);
        tinyKeeper.position.set(0, 0.7, 0); 
        scene.add(tinyKeeper);

        // --- 7. THE ANIMATION LOOP ---
        function animate() {
            const time = performance.now() * 0.001;
            const delta = Math.min(clock.getDelta(), 0.1); 

            // Winkle Pulse
            winkleMat.opacity = 0.3 + 0.7 * Math.sin(time * 1.5);

            // VR conflict fix
            controls.enabled = !renderer.xr.isPresenting;
            tinyKeeper.visible = renderer.xr.isPresenting;
            
            if (tinyKeeper.visible) {
                tinyKeeper.position.copy(camera.position);
                tinyKeeper.position.y -= 0.8; 
            }

            // Locomotion
            if (controls.enabled) {
                const speed = keys.shift ? 10.0 : 4.0;
                if (keys.w) controls.moveForward(speed * delta);
                if (keys.s) controls.moveForward(-speed * delta);
                if (keys.a) controls.moveRight(-speed * delta);
                if (keys.d) controls.moveRight(speed * delta);
            }

            // TinyKeeper Fix 3: Bounds clamped to the floor so you don't float into the void
            const camPos = controls.getObject().position;
            camPos.x = Math.max(-9.5, Math.min(9.5, camPos.x));
            camPos.z = Math.max(-9.5, Math.min(9.5, camPos.z));

            // TinyKeeper Fix 4: Simple table collision radius
            const tableCenterX = 0;
            const tableCenterZ = -1;
            const dx = camPos.x - tableCenterX;
            const dz = camPos.z - tableCenterZ;
            const distToTable = Math.sqrt(dx*dx + dz*dz);
            
            if (distToTable < 1.5) {
                // Push the camera back to the edge of the table's collision radius
                const angle = Math.atan2(dz, dx);
                camPos.x = tableCenterX + Math.cos(angle) * 1.5;
                camPos.z = tableCenterZ + Math.sin(angle) * 1.5;
            }

            renderer.render(scene, camera);
        }

        renderer.setAnimationLoop(animate);

        // --- 8. RESIZE HANDLER ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
