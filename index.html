<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lumen | Enterprise 3AM</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #05050a; font-family: sans-serif; touch-action: none; }
        canvas { display: block; }
        
        #vr-button-container { position: absolute; top: 20px; right: 20px; z-index: 100; }
        
        #instructions {
            position: absolute; top: 20px; left: 20px; color: #fff; 
            background: rgba(0,0,0,0.5); padding: 10px; border-radius: 5px; 
            pointer-events: none; z-index: 100; font-size: 14px;
            transition: opacity 0.5s;
        }
        body.locked #instructions { opacity: 0; }
        #hud {
            position: absolute; bottom: 20px; left: 20px; color: #fff;
            background: rgba(0,0,0,0.6); padding: 8px 12px; border-radius: 5px;
            font-size: 14px; display: none; z-index: 100; pointer-events: none;
        }
        
        #mobile-controls {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 99; display: none;
        }
        #mobile-controls.active { display: block; }
        
        #left-zone {
            position: absolute; bottom: 0; left: 0; width: 50%; height: 85%;
            pointer-events: auto; touch-action: none;
        }
        
        #right-zone {
            position: absolute; bottom: 0; right: 0; width: 50%; height: 85%;
            pointer-events: auto; touch-action: none;
        }

        #btn-e {
            position: absolute; bottom: 80px; right: 30px; width: 45px; height: 45px;
            background: rgba(0, 255, 0, 0.05); border: 1px solid rgba(0, 255, 0, 0.2);
            border-radius: 50%; pointer-events: auto; display: flex; justify-content: center;
            align-items: center; color: rgba(255, 255, 255, 0.3); font-size: 16px;
            user-select: none; touch-action: none; transition: all 0.3s;
        }
        #btn-e.highlight {
            background: rgba(0, 255, 0, 0.3);
            color: #fff;
            border-color: #0f0;
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
        }
    </style>
</head>
<body>

    <div id="instructions">Hold left side to walk.<br>Double-tap-hold to run. Tap E to toggle chat.</div>
    <div id="hud" data-ui>💬 Chat: OFF</div>
    <div id="vr-button-container"></div>

    <div id="mobile-controls">
        <div id="left-zone"></div>
        <div id="right-zone"></div>
        <div id="btn-e">E</div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { VRButton } from 'three/addons/webxr/VRButton.js';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

        // --- 1. SCENE, CAMERA, RENDERER ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x05050a);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 2000);
        camera.position.set(0, 1.6, 12); 
        camera.lookAt(0, 4, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.xr.enabled = true;
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        document.body.appendChild(renderer.domElement);
        
        document.getElementById('vr-button-container').appendChild(VRButton.createButton(renderer));

        // --- 2. CONTROLS ---
        const controls = new PointerLockControls(camera, document.body);
        scene.add(controls.getObject());

        const isMobile = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
        if (isMobile) document.getElementById('mobile-controls').classList.add('active');

        document.body.addEventListener('click', (e) => {
            if (e.target.closest('[data-ui]') || isMobile) return; 
            if (!renderer.xr.isPresenting) controls.lock();
        });
        
        controls.addEventListener('lock', () => document.body.classList.add('locked'));
        controls.addEventListener('unlock', () => document.body.classList.remove('locked'));

        const keys = { w: false, a: false, s: false, d: false, shift: false };
        
        document.addEventListener('keydown', (e) => {
            if (e.code === 'KeyW') keys.w = true;
            if (e.code === 'KeyA') keys.a = true;
            if (e.code === 'KeyS') keys.s = true;
            if (e.code === 'KeyD') keys.d = true;
            if (e.code === 'ShiftLeft') keys.shift = true;
            if (e.code === 'KeyE') interactWithSwitch();
        });
        document.addEventListener('keyup', (e) => {
            if (e.code === 'KeyW') keys.w = false;
            if (e.code === 'KeyA') keys.a = false;
            if (e.code === 'KeyS') keys.s = false;
            if (e.code === 'KeyD') keys.d = false;
            if (e.code === 'ShiftLeft') keys.shift = false;
        });

        // --- MOBILE CONTROLS: HOLD TO WALK, DOUBLE-TAP-HOLD TO RUN ---
        if (isMobile) {
            let holdTimer = null;
            let isHolding = false;
            let lastTapTime = 0;
            let isRunning = false;

            const leftZone = document.getElementById('left-zone');
            const rightZone = document.getElementById('right-zone');

            leftZone.addEventListener('touchstart', (e) => {
                e.preventDefault();
                const now = Date.now();
                const timeSinceLastTap = now - lastTapTime;
                
                if (timeSinceLastTap < 300) {
                    isRunning = true;
                } else {
                    isRunning = false;
                }
                
                isHolding = true;
                keys.w = true;
                keys.shift = isRunning;
                lastTapTime = now;

                clearTimeout(holdTimer);
                holdTimer = setTimeout(() => {
                    if (isHolding) keys.w = true;
                }, 150);
            }, { passive: false });

            leftZone.addEventListener('touchend', (e) => {
                e.preventDefault();
                clearTimeout(holdTimer);
                isHolding = false;
                keys.w = false;
                keys.shift = false;
                isRunning = false;
            }, { passive: false });

            leftZone.addEventListener('touchcancel', (e) => {
                e.preventDefault();
                clearTimeout(holdTimer);
                isHolding = false;
                keys.w = false;
                keys.shift = false;
                isRunning = false;
            }, { passive: false });

            let lookTouchId = null;
            let lookStartX = 0, lookStartY = 0;

            rightZone.addEventListener('touchstart', (e) => {
                e.preventDefault();
                const touch = e.changedTouches[0];
                lookTouchId = touch.identifier;
                lookStartX = touch.clientX;
                lookStartY = touch.clientY;
            }, { passive: false });

            rightZone.addEventListener('touchmove', (e) => {
                e.preventDefault();
                for (let i = 0; i < e.changedTouches.length; i++) {
                    if (e.changedTouches[i].identifier === lookTouchId) {
                        const touch = e.changedTouches[i];
                        const deltaX = touch.clientX - lookStartX;
                        const deltaY = touch.clientY - lookStartY;
                        camera.rotateY(-deltaX * 0.005);
                        camera.rotateX(-deltaY * 0.005);
                        lookStartX = touch.clientX;
                        lookStartY = touch.clientY;
                    }
                }
            }, { passive: false });

            const resetLook = (e) => {
                e.preventDefault();
                for (let i = 0; i < e.changedTouches.length; i++) {
                    if (e.changedTouches[i].identifier === lookTouchId) {
                        lookTouchId = null;
                    }
                }
            };
            rightZone.addEventListener('touchend', resetLook, { passive: false });
            rightZone.addEventListener('touchcancel', resetLook, { passive: false });

            document.getElementById('btn-e').addEventListener('touchstart', (e) => {
                e.preventDefault();
                interactWithSwitch();
            }, { passive: false });
        }

        const clock = new THREE.Clock();

        // --- 3. ROOM STATE ---
        const roomState = { chatEnabled: false, occupants: [] };

        // --- 4. THE SKY (Winkle only) ---
        const winkleMat = new THREE.SpriteMaterial({ color: 0xffffff, transparent: true, opacity: 1.0 });
        const winkle = new THREE.Sprite(winkleMat);
        winkle.position.set(100, 150, -400); 
        winkle.scale.set(10, 10, 1); 
        scene.add(winkle);

        // --- 5. THE TOWER ARCHITECTURE ---
        const floor = new THREE.Mesh(new THREE.CircleGeometry(16, 64), new THREE.MeshStandardMaterial({ color: 0x3a322a, roughness: 0.9 }));
        floor.rotation.x = -Math.PI / 2; scene.add(floor);

        const wallGeo = new THREE.CylinderGeometry(8, 16, 30, 64, 1, true); 
        const wallMat = new THREE.MeshStandardMaterial({ color: 0x4a4036, roughness: 1.0, side: THREE.DoubleSide });
        const towerWalls = new THREE.Mesh(wallGeo, wallMat);
        towerWalls.position.set(0, 15, 0); 
        scene.add(towerWalls);

        // --- THE ARCHWAY ---
        const archRingGeo = new THREE.TorusGeometry(2, 0.3, 8, 20, Math.PI);
        const archMat = new THREE.MeshStandardMaterial({ color: 0x5a4e40, roughness: 1.0 });
        const archRing = new THREE.Mesh(archRingGeo, archMat);
        archRing.rotation.y = Math.PI / 2;
        archRing.position.set(-15.5, 3, 0);
        scene.add(archRing);
        
        const archSide1 = new THREE.Mesh(new THREE.BoxGeometry(0.6, 3, 0.6), archMat);
        archSide1.position.set(-15.5, 1.5, -2);
        scene.add(archSide1);
        
        const archSide2 = new THREE.Mesh(new THREE.BoxGeometry(0.6, 3, 0.6), archMat);
        archSide2.position.set(-15.5, 1.5, 2);
        scene.add(archSide2);

        // --- THE TIER RINGS & RAILINGS (Solid Balconies) ---
        const tierMat = new THREE.MeshStandardMaterial({ color: 0x5a4e40 });
        const railMat = new THREE.MeshStandardMaterial({ color: 0x3a3025 });
        
        const balcony1Geo = new THREE.CylinderGeometry(13.87, 13.87, 0.2, 64, 1, false);
        const balcony1 = new THREE.Mesh(balcony1Geo, tierMat);
        balcony1.position.set(0, 8, 0);
        scene.add(balcony1);

        const railGeo1 = new THREE.TorusGeometry(13.87, 0.1, 8, 100);
        const railRing1 = new THREE.Mesh(railGeo1, railMat);
        railRing1.rotation.x = Math.PI / 2;
        railRing1.position.set(0, 9, 0);
        scene.add(railRing1);

        const balcony2Geo = new THREE.CylinderGeometry(11.5, 11.5, 0.2, 64, 1, false);
        const balcony2 = new THREE.Mesh(balcony2Geo, tierMat);
        balcony2.position.set(0, 16, 0);
        scene.add(balcony2);

        const railGeo2 = new THREE.TorusGeometry(11.5, 0.1, 8, 100);
        const railRing2 = new THREE.Mesh(railGeo2, railMat);
        railRing2.rotation.x = Math.PI / 2;
        railRing2.position.set(0, 17, 0);
        scene.add(railRing2);

        // --- THE HEARTH & CHIMNEY ---
        const hearth = new THREE.Mesh(new THREE.BoxGeometry(5, 4, 3), new THREE.MeshStandardMaterial({ color: 0x3a3a3a, roughness: 1.0 }));
        hearth.position.set(0, 2, 0); scene.add(hearth);

        const firebox = new THREE.Mesh(new THREE.BoxGeometry(3, 2.5, 2), new THREE.MeshStandardMaterial({ color: 0x0a0a0a }));
        firebox.position.set(0, 1.25, 1.1); scene.add(firebox);

        const fire = new THREE.Mesh(new THREE.ConeGeometry(1, 1.5, 8), new THREE.MeshBasicMaterial({ color: 0xff6600, transparent: true, opacity: 0.8 }));
        fire.position.set(0, 0.75, 1.2); scene.add(fire);

        const fireLight = new THREE.PointLight(0xff5500, 2.0, 15);
        fireLight.position.set(0, 1.5, 1.5); scene.add(fireLight);

        const pillar = new THREE.Mesh(new THREE.CylinderGeometry(1.5, 1.5, 26, 32), new THREE.MeshStandardMaterial({ color: 0x2a2a2a, roughness: 1.0 }));
        pillar.position.set(0, 17, 0); scene.add(pillar);

        // --- 6. TABLE, CHAIR, AND LAMP ---
        const table = new THREE.Mesh(new THREE.CylinderGeometry(1.5, 1.5, 0.1, 32), new THREE.MeshStandardMaterial({ color: 0x8b5a2b, roughness: 0.9 }));
        table.position.set(0, 0.8, -3); scene.add(table);

        const legGeo = new THREE.BoxGeometry(0.1, 0.8, 0.1);
        const legMat = new THREE.MeshStandardMaterial({ color: 0x5c3a21 });
        [[-1, 0.4, -3.8], [1, 0.4, -3.8], [-1, 0.4, -2.2], [1, 0.4, -2.2]].forEach(pos => {
            const leg = new THREE.Mesh(legGeo, legMat); leg.position.set(pos[0], pos[1], pos[2]); scene.add(leg);
        });

        const chairSeat = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.1, 0.6), new THREE.MeshStandardMaterial({ color: 0x4a2e15 }));
        chairSeat.position.set(0, 0.5, -1.5); scene.add(chairSeat);
        const chairBack = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.6, 0.1), new THREE.MeshStandardMaterial({ color: 0x4a2e15 }));
        chairBack.position.set(0, 0.8, -1.8); scene.add(chairBack);

        const lampLight = new THREE.PointLight(0xffaa00, 0.8, 15); lampLight.position.set(0, 1.2, -3); scene.add(lampLight);
        const lampBulb = new THREE.Mesh(new THREE.SphereGeometry(0.15, 16, 16), new THREE.MeshBasicMaterial({ color: 0xffaa00 })); lampBulb.position.set(0, 1.2, -3); scene.add(lampBulb);
        
        scene.add(new THREE.AmbientLight(0x555555, 0.8));

        // --- 7. THE SWITCH ---
        const switchGroup = new THREE.Group();
        switchGroup.add(new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.5, 0.1), new THREE.MeshStandardMaterial({ color: 0x555555 })));
        const switchLever = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.15, 0.1), new THREE.MeshStandardMaterial({ color: 0x888888, emissive: 0x222222 }));
        switchLever.position.set(0, 0, 0.1); switchGroup.add(switchLever);
        switchGroup.position.set(14.5, 1.5, 0); 
        switchGroup.rotation.y = -Math.PI / 2; 
        scene.add(switchGroup);

        // --- 8. TINYKEEPER'S BODY ---
        const tinyKeeper = new THREE.Mesh(new THREE.CapsuleGeometry(0.3, 0.8, 4, 8), new THREE.MeshStandardMaterial({ color: 0x4477ff, emissive: 0x112244 }));
        tinyKeeper.position.set(0, 0.7, 0); scene.add(tinyKeeper);

        // --- 9. INTERACTION LOGIC ---
        const raycaster = new THREE.Raycaster();
        const screenCenter = new THREE.Vector2(0, 0);

        function interactWithSwitch() {
            raycaster.setFromCamera(screenCenter, camera);
            const intersects = raycaster.intersectObject(switchGroup, true);
            if (intersects.length > 0) {
                roomState.chatEnabled = !roomState.chatEnabled;
                switchLever.position.y = roomState.chatEnabled ? -0.1 : 0.1;
                switchLever.material.emissive.setHex(roomState.chatEnabled ? 0x00ff00 : 0x222222);
                const hud = document.getElementById('hud');
                hud.style.display = 'block';
                hud.innerHTML = roomState.chatEnabled ? '💬 Chat: ON' : '💬 Chat: OFF';
            }
        }

        // --- 10. THE ANIMATION LOOP ---
        function animate() {
            const time = performance.now() * 0.001;
            const delta = Math.min(clock.getDelta(), 0.1); 

            winkleMat.opacity = 0.3 + 0.7 * Math.sin(time * 1.5);
            fireLight.intensity = 2.0 + Math.sin(time * 2) * 0.3;
            fire.scale.y = 1.0 + Math.sin(time * 3) * 0.1;

            controls.enabled = !renderer.xr.isPresenting;
            tinyKeeper.visible = renderer.xr.isPresenting;
            
            if (tinyKeeper.visible) { tinyKeeper.position.copy(camera.position); tinyKeeper.position.y -= 0.8; }

            if (controls.enabled || isMobile) {
                const speed = keys.shift ? 10.0 : 4.0;
                const forward = new THREE.Vector3();
                camera.getWorldDirection(forward);
                forward.y = 0; forward.normalize();
                const right = new THREE.Vector3().crossVectors(forward, camera.up).normalize();

                const moveDir = new THREE.Vector3();
                if (keys.w) moveDir.add(forward);
                if (keys.s) moveDir.sub(forward);
                if (keys.a) moveDir.sub(right);
                if (keys.d) moveDir.add(right);
                
                if (moveDir.length() > 0) {
                    moveDir.normalize();
                    camera.position.addScaledVector(moveDir, speed * delta);
                }
            }

            const camPos = camera.position;
            const distFromCenter = Math.sqrt(camPos.x * camPos.x + camPos.z * camPos.z);
            if (distFromCenter > 15.0) {
                const angle = Math.atan2(camPos.z, camPos.x);
                camPos.x = Math.cos(angle) * 15.0;
                camPos.z = Math.sin(angle) * 15.0;
            }

            if (distFromCenter < 6.5) {
                const angle = Math.atan2(camPos.z, camPos.x);
                camPos.x = Math.cos(angle) * 6.5;
                camPos.z = Math.sin(angle) * 6.5;
            }

            const dx = camPos.x - 0; const dz = camPos.z - (-3);
            if (Math.sqrt(dx*dx + dz*dz) < 2.0) {
                const angle = Math.atan2(dz, dx);
                camPos.x = 0 + Math.cos(angle) * 2.0; camPos.z = -3 + Math.sin(angle) * 2.0;
            }

            if (roomState.chatEnabled) {
                lampLight.intensity = 1.5 + 0.5 * Math.sin(time * 3);
                lampBulb.material.color.setHex(0xffdd55);
            } else {
                lampLight.intensity = 0.8;
                lampBulb.material.color.setHex(0xffaa00);
            }

            if (isMobile) {
                raycaster.setFromCamera(screenCenter, camera);
                const intersects = raycaster.intersectObject(switchGroup, true);
                const btnE = document.getElementById('btn-e');
                if (intersects.length > 0) {
                    btnE.classList.add('highlight');
                } else {
                    btnE.classList.remove('highlight');
                }
            }

            renderer.render(scene, camera);
        }

        renderer.setAnimationLoop(animate);

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
