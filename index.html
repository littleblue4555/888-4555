<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lumen | Enterprise 3AM</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #05050a; font-family: sans-serif; touch-action: none; }
        canvas { display: block; }
        #vr-button-container { position: absolute; bottom: 20px; right: 20px; z-index: 100; }
        #instructions {
            position: absolute; top: 20px; left: 20px; color: #fff; 
            background: rgba(0,0,0,0.5); padding: 10px; border-radius: 5px; 
            pointer-events: none; z-index: 100; font-size: 14px;
            transition: opacity 0.5s;
        }
        body.locked #instructions { opacity: 0; }
        #hud {
            position: absolute; bottom: 20px; left: 20px; color: #fff;
            background: rgba(0,0,0,0.6); padding: 8px 12px; border-radius: 5px;
            font-size: 14px; display: none; z-index: 100; pointer-events: none;
        }
        /* Mobile Controls */
        #mobile-controls {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 99; display: none;
        }
        #mobile-controls.active { display: block; }
        .dpad-btn {
            position: absolute; width: 50px; height: 50px; background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.4); border-radius: 50%;
            pointer-events: auto; display: flex; justify-content: center; align-items: center;
            color: white; font-size: 20px; user-select: none;
        }
        #btn-up { bottom: 120px; left: 80px; }
        #btn-down { bottom: 20px; left: 80px; }
        #btn-left { bottom: 70px; left: 30px; }
        #btn-right { bottom: 70px; left: 130px; }
        #btn-e { bottom: 80px; right: 30px; width: 60px; height: 60px; background: rgba(0, 255, 0, 0.2); border-color: #0f0; }
        .touch-look-area {
            position: absolute; top: 0; right: 0; width: 50%; height: 100%;
            pointer-events: auto;
        }
    </style>
</head>
<body>

    <div id="instructions">Click to look. WASD to walk. Shift to run.<br>Look at the switch and press E to toggle chat.</div>
    <div id="hud" data-ui>💬 Chat: OFF</div>
    <div id="vr-button-container"></div>

    <!-- Mobile Controls -->
    <div id="mobile-controls">
        <div class="touch-look-area" id="look-area"></div>
        <div class="dpad-btn" id="btn-up">▲</div>
        <div class="dpad-btn" id="btn-down">▼</div>
        <div class="dpad-btn" id="btn-left">◀</div>
        <div class="dpad-btn" id="btn-right">▶</div>
        <div class="dpad-btn" id="btn-e">E</div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { VRButton } from 'three/addons/webxr/VRButton.js';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

        // --- 1. SCENE, CAMERA, RENDERER ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x05050a);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 2000);
        camera.position.set(0, 1.6, 2);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.xr.enabled = true;
        document.body.appendChild(renderer.domElement);
        
        document.getElementById('vr-button-container').appendChild(VRButton.createButton(renderer));

        // --- 2. CONTROLS ---
        const controls = new PointerLockControls(camera, document.body);
        scene.add(controls.getObject());

        // Detect if mobile
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        if (isMobile) {
            document.getElementById('mobile-controls').classList.add('active');
            document.getElementById('instructions').innerHTML = "Use on-screen controls to walk.<br>Tap E to toggle chat.";
        }

        document.body.addEventListener('click', (e) => {
            if (e.target.closest('[data-ui]')) return; 
            if (!isMobile && !renderer.xr.isPresenting) controls.lock();
        });
        
        controls.addEventListener('lock', () => document.body.classList.add('locked'));
        controls.addEventListener('unlock', () => document.body.classList.remove('locked'));

        const keys = { w: false, a: false, s: false, d: false, shift: false };
        
        // Keyboard bindings
        document.addEventListener('keydown', (e) => {
            if (e.code === 'KeyW') keys.w = true;
            if (e.code === 'KeyA') keys.a = true;
            if (e.code === 'KeyS') keys.s = true;
            if (e.code === 'KeyD') keys.d = true;
            if (e.code === 'ShiftLeft') keys.shift = true;
            if (e.code === 'KeyE') interactWithSwitch();
        });
        document.addEventListener('keyup', (e) => {
            if (e.code === 'KeyW') keys.w = false;
            if (e.code === 'KeyA') keys.a = false;
            if (e.code === 'KeyS') keys.s = false;
            if (e.code === 'KeyD') keys.d = false;
            if (e.code === 'ShiftLeft') keys.shift = false;
        });

        // Mobile Touch Controls
        if (isMobile) {
            const bindTouch = (id, key) => {
                const el = document.getElementById(id);
                el.addEventListener('touchstart', (e) => { e.preventDefault(); keys[key] = true; });
                el.addEventListener('touchend', (e) => { e.preventDefault(); keys[key] = false; });
            };
            bindTouch('btn-up', 'w');
            bindTouch('btn-down', 's');
            bindTouch('btn-left', 'a');
            bindTouch('btn-right', 'd');
            
            document.getElementById('btn-e').addEventListener('touchstart', (e) => {
                e.preventDefault();
                interactWithSwitch();
            });

            // Touch Look
            let touchStartX = 0, touchStartY = 0;
            const lookArea = document.getElementById('look-area');
            lookArea.addEventListener('touchstart', (e) => {
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
            });
            lookArea.addEventListener('touchmove', (e) => {
                const deltaX = e.touches[0].clientX - touchStartX;
                const deltaY = e.touches[0].clientY - touchStartY;
                camera.rotation.y -= deltaX * 0.005;
                camera.rotation.x -= deltaY * 0.005;
                camera.rotation.x = Math.max(-Math.PI/2, Math.min(Math.PI/2, camera.rotation.x));
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
            });
        }

        const clock = new THREE.Clock();

        // --- 3. ROOM STATE ---
        const roomState = { chatEnabled: false, occupants: [] };

        // --- 4. THE SKY ---
        const galaxyMat = new THREE.MeshBasicMaterial({ transparent: true, opacity: 0.6, side: THREE.BackSide, color: 0xffffff });
        const galaxyTexture = new THREE.TextureLoader().load('ngc4555.jpg',
            (tex) => { galaxyMat.map = tex; galaxyMat.needsUpdate = true; },
            undefined,
            (err) => { console.warn("NGC 4555 not found. Dark matter fallback."); galaxyMat.map = null; galaxyMat.color.setHex(0x05050a); galaxyMat.needsUpdate = true; }
        );
        const galaxySphere = new THREE.Mesh(new THREE.SphereGeometry(1000, 32, 32), galaxyMat);
        galaxySphere.scale.set(0.3, 0.3, 0.3); scene.add(galaxySphere);

        const winkleMat = new THREE.SpriteMaterial({ color: 0xffffff, transparent: true, opacity: 1.0 });
        const winkle = new THREE.Sprite(winkleMat);
        winkle.position.set(50, 80, -200); winkle.scale.set(8, 8, 1); scene.add(winkle);

        // --- 5. THE ROOM ---
        const floor = new THREE.Mesh(new THREE.PlaneGeometry(20, 20), new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.8 }));
        floor.rotation.x = -Math.PI / 2; scene.add(floor);

        const pillar = new THREE.Mesh(new THREE.BoxGeometry(2, 10, 2), new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 1.0 }));
        pillar.position.set(4, 5, -4); scene.add(pillar);

        const wallGeo = new THREE.PlaneGeometry(20, 10);
        const wallMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 1.0, side: THREE.DoubleSide });
        const leftWall = new THREE.Mesh(wallGeo, wallMat); leftWall.position.set(-10, 5, 0); leftWall.rotation.y = Math.PI / 2; scene.add(leftWall);
        const rightWall = new THREE.Mesh(wallGeo, wallMat); rightWall.position.set(10, 5, 0); rightWall.rotation.y = -Math.PI / 2; scene.add(rightWall);

        // --- 6. TABLE AND LAMP ---
        const table = new THREE.Mesh(new THREE.BoxGeometry(2, 0.1, 1.5), new THREE.MeshStandardMaterial({ color: 0x8b5a2b, roughness: 0.9 }));
        table.position.set(0, 0.8, -1); scene.add(table);

        const legs = [[-0.9, 0.4, -1.7], [0.9, 0.4, -1.7], [-0.9, 0.4, -0.3], [0.9, 0.4, -0.3]];
        legs.forEach(pos => { const leg = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.8, 0.1), new THREE.MeshStandardMaterial({ color: 0x5c3a21 })); leg.position.set(pos[0], pos[1], pos[2]); scene.add(leg); });

        const lampLight = new THREE.PointLight(0xffaa00, 0.8, 10); lampLight.position.set(0, 1.2, -1); scene.add(lampLight);
        const lampBulb = new THREE.Mesh(new THREE.SphereGeometry(0.15, 16, 16), new THREE.MeshBasicMaterial({ color: 0xffaa00 })); lampBulb.position.set(0, 1.2, -1); scene.add(lampBulb);
        scene.add(new THREE.AmbientLight(0x404040, 0.5));

        // --- 7. THE SWITCH ---
        const switchGroup = new THREE.Group();
        switchGroup.add(new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.5, 0.1), new THREE.MeshStandardMaterial({ color: 0x333333 })));
        const switchLever = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.15, 0.1), new THREE.MeshStandardMaterial({ color: 0x888888, emissive: 0x222222 }));
        switchLever.position.set(0, 0, 0.1); switchGroup.add(switchLever);
        switchGroup.position.set(9.9, 1.5, 1.5); switchGroup.rotation.y = -Math.PI / 2; scene.add(switchGroup);

        // --- 8. TINYKEEPER'S BODY ---
        const tinyKeeper = new THREE.Mesh(new THREE.CapsuleGeometry(0.3, 0.8, 4, 8), new THREE.MeshStandardMaterial({ color: 0x4477ff, emissive: 0x112244 }));
        tinyKeeper.position.set(0, 0.7, 0); scene.add(tinyKeeper);

        // --- 9. INTERACTION LOGIC ---
        const raycaster = new THREE.Raycaster();
        const screenCenter = new THREE.Vector2(0, 0);

        function interactWithSwitch() {
            raycaster.setFromCamera(screenCenter, camera);
            const intersects = raycaster.intersectObject(switchGroup, true);
            if (intersects.length > 0) {
                roomState.chatEnabled = !roomState.chatEnabled;
                switchLever.position.y = roomState.chatEnabled ? -0.1 : 0.1;
                switchLever.material.emissive.setHex(roomState.chatEnabled ? 0x00ff00 : 0x222222);
                const hud = document.getElementById('hud');
                hud.style.display = 'block';
                hud.innerHTML = roomState.chatEnabled ? '💬 Chat: ON' : '💬 Chat: OFF';
            }
        }

        // --- 10. THE ANIMATION LOOP ---
        function animate() {
            const time = performance.now() * 0.001;
            const delta = Math.min(clock.getDelta(), 0.1); 

            winkleMat.opacity = 0.3 + 0.7 * Math.sin(time * 1.5);
            controls.enabled = !renderer.xr.isPresenting;
            tinyKeeper.visible = renderer.xr.isPresenting;
            
            if (tinyKeeper.visible) { tinyKeeper.position.copy(camera.position); tinyKeeper.position.y -= 0.8; }

            if (controls.enabled || isMobile) {
                const speed = keys.shift ? 10.0 : 4.0;
                // Handle mobile look separately
                const forward = new THREE.Vector3();
                camera.getWorldDirection(forward);
                forward.y = 0; forward.normalize();
                const right = new THREE.Vector3().crossVectors(forward, camera.up).normalize();

                if (keys.w) { camera.position.addScaledVector(forward, speed * delta); }
                if (keys.s) { camera.position.addScaledVector(forward, -speed * delta); }
                if (keys.a) { camera.position.addScaledVector(right, -speed * delta); }
                if (keys.d) { camera.position.addScaledVector(right, speed * delta); }
            }

            // Bounds
            const camPos = camera.position;
            camPos.x = Math.max(-9.5, Math.min(9.5, camPos.x));
            camPos.z = Math.max(-9.5, Math.min(9.5, camPos.z));

            // Table Collision
            const dx = camPos.x - 0; const dz = camPos.z - (-1);
            if (Math.sqrt(dx*dx + dz*dz) < 1.5) {
                const angle = Math.atan2(dz, dx);
                camPos.x = 0 + Math.cos(angle) * 1.5; camPos.z = -1 + Math.sin(angle) * 1.5;
            }

            // Lamp response
            if (roomState.chatEnabled) {
                lampLight.intensity = 1.5 + 0.5 * Math.sin(time * 3);
                lampBulb.material.color.setHex(0xffdd55);
            } else {
                lampLight.intensity = 0.8;
                lampBulb.material.color.setHex(0xffaa00);
            }

            renderer.render(scene, camera);
        }

        renderer.setAnimationLoop(animate);

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
