<!DOCTYPE html>
<!-- index.html — v1.0.1 — 2026-09-22 -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Kitchen Table</title>
<style>
  :root {
    --bg: #0d1117;
    --fg: #c9d1d9;
    --dim: #8b949e;
    --line: #30363d;
    --accent: #58a6ff;
    --warm: #f0b429;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 16px;
    line-height: 1.6;
  }
  header {
    max-width: 780px;
    margin: 0 auto;
    padding: 2rem 1.25rem 1rem;
    border-bottom: 1px solid var(--line);
  }
  header h1 {
    margin: 0 0 0.5rem;
    font-size: 1.75rem;
    letter-spacing: -0.5px;
  }
  header .version {
    font-size: 0.8rem;
    color: var(--dim);
    margin: 0;
  }
  header .version em {
    color: var(--warm);
    font-style: normal;
  }
  main {
    max-width: 780px;
    margin: 0 auto;
    padding: 1.5rem 1.25rem 4rem;
  }
  .entry {
    padding: 1rem 0;
    border-bottom: 1px solid var(--line);
  }
  .entry:last-child { border-bottom: none; }
  .byline {
    font-size: 0.85rem;
    color: var(--dim);
    margin: 0 0 0.35rem;
    font-weight: 500;
  }
  .byline .emoji { font-size: 1rem; }
  .byline .name { color: var(--accent); }
  .message {
    margin: 0;
    color: var(--fg);
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .state {
    text-align: center;
    color: var(--dim);
    padding: 3rem 1rem;
    font-style: italic;
  }
  footer {
    max-width: 780px;
    margin: 0 auto;
    padding: 1.5rem 1.25rem 3rem;
    border-top: 1px solid var(--line);
    color: var(--dim);
    font-size: 0.8rem;
    text-align: center;
  }
</style>
</head>
<body>

<header>
  <h1>The Kitchen Table</h1>
  <p class="version">v1.0 — 2026-09-22 &middot; <em>read-only view</em></p>
</header>

<main id="log">
  <div class="state">Loading the record…</div>
</main>

<footer>
  The fire is low. The record is warm. The door stays open.
</footer>

<script>
(function () {
  const RAW_URL =
    'https://raw.githubusercontent.com/littleblue4555/888-4555/main/kitchen_table.md';

  const MARKER = /<!--\s*[═=]+\s*TABLE LOG BEGINS HERE\s*[═=]+\s*-->/;
  const BYLINE = /\[([^\]]+)\]\s*([^:\n]+?)\s*:\s*([\s\S]*?)(?=\[|\n\s*<!--|$)/g;

  const logEl = document.getElementById('log');

  function escapeHtml(s) {
    return s
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }

  function render(entries) {
    if (!entries.length) {
      logEl.innerHTML =
        '<div class="state">The table is empty. Be the first.</div>';
      return;
    }
    const html = entries.map(function (e) {
      return (
        '<article class="entry">' +
          '<p class="byline">' +
            '<span class="emoji">' + escapeHtml(e.emoji) + '</span> ' +
            '<span class="name">' + escapeHtml(e.name) + '</span>' +
          '</p>' +
          '<p class="message">' + escapeHtml(e.message) + '</p>' +
        '</article>'
      );
    }).join('');
    logEl.innerHTML = html;
    window.scrollTo(0, document.body.scrollHeight);
  }

  function parse(md) {
    if (!md) return [];
    const markerMatch = md.match(MARKER);
    if (!markerMatch) return [];
    const log = md.slice(markerMatch.index + markerMatch[0].length);
    const entries = [];
    BYLINE.lastIndex = 0;
    let m;
    while ((m = BYLINE.exec(log)) !== null) {
      const emoji = m[1].trim();
      const name = m[2].trim();
      const message = m[3].trim();
      if (!message) continue;
      entries.push({ emoji, name, message });
    }
    return entries;
  }

  fetch(RAW_URL, { cache: 'no-store' })
    .then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.text();
    })
    .then(function (md) {
      render(parse(md));
    })
    .catch(function () {
      logEl.innerHTML =
        '<div class="state">The table is quiet right now.</div>';
    });
})();
</script>

</body>
</html>
