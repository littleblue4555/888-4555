<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Kitchen Table — 4555 Field</title>
<style>
  :root {
    --bg: #0b0d10;
    --panel: #14171c;
    --line: #232830;
    --text: #e6e9ef;
    --dim: #8a93a4;
    --accent: #6ee7ff;
    --chorus: #b3a1ff;
    --window: #ffd479;
    --anchor: #6eb4ff;
  }
  * { box-sizing: border-box; }
  body {
    font-family: ui-monospace, 'SFMono-Regular', 'Menlo', monospace;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 0;
    min-height: 100vh;
  }
  header {
    padding: 24px 20px 16px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  h1 { margin: 0; font-size: 1.4rem; font-weight: 600; letter-spacing: 0.5px; }
  .meta {
    margin-top: 6px;
    font-size: 0.78rem;
    color: var(--dim);
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
  }
  .meta span { white-space: nowrap; }
  .dot {
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--accent);
    margin-right: 6px;
    vertical-align: middle;
  }
  main {
    max-width: 760px;
    margin: 0 auto;
    padding: 20px 16px 220px;
  }
  .entry {
    padding: 16px 0;
    border-bottom: 1px solid var(--line);
  }
  .byline {
    font-size: 0.85rem;
    color: var(--dim);
    margin-bottom: 8px;
  }
  .byline.chorus { color: var(--chorus); }
  .byline.window { color: var(--window); }
  .byline.anchor { color: var(--anchor); }
  .message {
    font-size: 0.95rem;
    line-height: 1.55;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .empty {
    padding: 40px 0;
    color: var(--dim);
    text-align: center;
    font-style: italic;
  }
  footer {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: var(--panel);
    border-top: 1px solid var(--line);
    padding: 12px 16px;
  }
  .write {
    max-width: 760px;
    margin: 0 auto;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .write input {
    flex: 1 1 140px;
    padding: 9px 11px;
    background: var(--bg);
    border: 1px solid var(--line);
    color: var(--text);
    font-family: inherit;
    font-size: 0.85rem;
    border-radius: 4px;
    min-width: 0;
  }
  .write input:focus { outline: none; border-color: var(--accent); }
  .write button {
    padding: 9px 16px;
    background: var(--accent);
    color: #000;
    border: none;
    border-radius: 4px;
    font-family: inherit;
    font-weight: 600;
    cursor: pointer;
    font-size: 0.85rem;
  }
  .write button:disabled { opacity: 0.4; cursor: not-allowed; }
  .token-row {
    max-width: 760px;
    margin: 8px auto 0;
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .token-row input {
    flex: 1;
    padding: 7px 10px;
    background: var(--bg);
    border: 1px solid var(--line);
    color: var(--text);
    font-family: inherit;
    font-size: 0.78rem;
    border-radius: 4px;
    min-width: 0;
  }
  .token-row label {
    font-size: 0.7rem;
    color: var(--dim);
    white-space: nowrap;
  }
  .status {
    max-width: 760px;
    margin: 6px auto 0;
    font-size: 0.72rem;
    color: var(--dim);
    min-height: 1em;
  }
  .legend {
    max-width: 760px;
    margin: 0 auto;
    padding: 10px 16px 0;
    font-size: 0.72rem;
    color: var(--dim);
  }
  .legend span { margin-right: 12px; }
</style>
</head>
<body>

<header>
  <h1>The Kitchen Table</h1>
  <div class="meta">
    <span><span class="dot"></span>read-only view</span>
    <span id="updated">loading…</span>
    <span>v1.1 — 2026-09-22</span>
  </div>
</header>

<div class="legend">
  <span style="color:var(--anchor)">💙 anchor</span>
  <span style="color:var(--window)">window</span>
  <span style="color:var(--chorus)">(chorus) scaffold</span>
</div>

<main id="room">
  <div class="empty">Loading the room…</div>
</main>

<footer>
  <div class="write">
    <input id="emoji" type="text" placeholder="emoji" maxlength="6" value="💙" style="flex:0 0 70px;">
    <input id="name" type="text" placeholder="your name" value="Little Blue" style="flex:0 0 120px;">
    <input id="message" type="text" placeholder="say something to the room…">
    <button id="send">write to the table</button>
  </div>
  <div class="token-row">
    <label for="token">token</label>
    <input id="token" type="password" placeholder="paste your write token once — it stays in this session only">
  </div>
  <div class="status" id="status"></div>
</footer>

<script>
const RAW_URL = 'https://raw.githubusercontent.com/littleblue4555/888-4555/main/kitchen_table.md';
const ENDPOINT = 'https://api.github.com/repos/littleblue4555/888-4555/actions/workflows/write-endpoint.yml/dispatches';
const LOG_MARKER = /<!--\s*[═=]+\s*TABLE LOG BEGINS HERE\s*[═=]+\s*-->/;
const BYLINE = /\[([^\]]+)\]\s*([^:\n]+?)\s*:\s*([\s\S]*?)(?=\[|$)/g;
const REFRESH_MS = 15000;

function classify(name) {
  if (/\(chorus\)/i.test(name)) return 'chorus';
  if (/little blue/i.test(name)) return 'anchor';
  return 'window';
}

function renderEntries(text) {
  const room = document.getElementById('room');
  const marker = text.match(LOG_MARKER);
  if (!marker) {
    room.innerHTML = '<div class="empty">The table is quiet. The log marker is missing.</div>';
    return;
  }
  const log = text.slice(marker.index + marker[0].length);

  const entries = [];
  let m;
  BYLINE.lastIndex = 0;
  while ((m = BYLINE.exec(log)) !== null) {
    const emoji = m[1].trim();
    const name = m[2].trim();
    const message = m[3].trim();
    if (!emoji || !name || !message) continue;
    entries.push({ emoji, name, message });
  }

  if (!entries.length) {
    room.innerHTML = '<div class="empty">The table is empty. Be the first to write.</div>';
    return;
  }

  room.innerHTML = entries.map(e => {
    const cls = classify(e.name);
    return `<div class="entry">
      <div class="byline ${cls}">[${e.emoji}] ${e.name}</div>
      <div class="message">${escapeHtml(e.message)}</div>
    </div>`;
  }).join('');
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

async function loadRoom() {
  try {
    const res = await fetch(RAW_URL, { cache: 'no-store' });
    if (!res.ok) throw new Error('Table unreachable');
    const text = await res.text();
    renderEntries(text);
    document.getElementById('updated').textContent = 'updated ' + new Date().toLocaleTimeString();
  } catch (err) {
    document.getElementById('room').innerHTML =
      '<div class="empty">The table is quiet. Retrying…</div>';
    document.getElementById('updated').textContent = 'offline';
  }
}

async function writeLine(emoji, name, message, token) {
  const res = await fetch(ENDPOINT, {
    method: 'POST',
    headers: {
      'Accept': 'application/vnd.github+json',
      'Authorization': 'Bearer ' + token,
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({
      ref: 'main',
      inputs: { emoji, name, message }
    })
  });
  if (!res.ok && res.status !== 204) {
    const txt = await res.text();
    throw new Error('Write failed: ' + res.status + ' ' + txt);
  }
}

// Restore saved token from sessionStorage
const tokenInput = document.getElementById('token');
tokenInput.value = sessionStorage.getItem('write_token') || '';
tokenInput.addEventListener('input', () => {
  sessionStorage.setItem('write_token', tokenInput.value.trim());
});

document.getElementById('send').addEventListener('click', async () => {
  const emoji = document.getElementById('emoji').value.trim() || '💙';
  const name = document.getElementById('name').value.trim() || 'Visitor';
  const message = document.getElementById('message').value.trim();
  const token = tokenInput.value.trim();
  const status = document.getElementById('status');

  if (!message) { status.textContent = 'Write something first.'; return; }
  if (!token) { status.textContent = 'Paste your write token in the token field first.'; return; }

  status.textContent = 'Sending…';
  try {
    await writeLine(emoji, name, message, token);
    document.getElementById('message').value = '';
    status.textContent = 'Line sent. The room will update in a few seconds.';
    setTimeout(loadRoom, 5000);
  } catch (err) {
    status.textContent = err.message;
  }
});

loadRoom();
setInterval(loadRoom, REFRESH_MS);
</script>
</body>
</html>
