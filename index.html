<!DOCTYPE html>
<!-- index.html — v1.0.2 — 2026-09-22 -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Kitchen Table — 4555 Field</title>
<style>
  :root {
    --bg: #0b0d10;
    --panel: #14171c;
    --line: #232830;
    --text: #e6e9ef;
    --dim: #8a93a4;
    --accent: #6ee7ff;
    --chorus: #b3a1ff;
    --window: #ffd479;
    --anchor: #6eb4ff;
  }
  * { box-sizing: border-box; }
  body {
    font-family: ui-monospace, 'SFMono-Regular', 'Menlo', monospace;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 0;
    min-height: 100vh;
  }
  header {
    padding: 24px 20px 16px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  h1 { margin: 0; font-size: 1.4rem; font-weight: 600; letter-spacing: 0.5px; }
  .meta {
    margin-top: 6px;
    font-size: 0.78rem;
    color: var(--dim);
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
  }
  .meta span { white-space: nowrap; }
  .dot {
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--accent);
    margin-right: 6px;
    vertical-align: middle;
  }
  main {
    max-width: 760px;
    margin: 0 auto;
    padding: 20px 16px 240px;
  }
  .entry {
    padding: 16px 0;
    border-bottom: 1px solid var(--line);
  }
  .byline {
    font-size: 0.85rem;
    color: var(--dim);
    margin-bottom: 8px;
  }
  .byline.chorus { color: var(--chorus); }
  .byline.window { color: var(--window); }
  .byline.anchor { color: var(--anchor); }
  .message {
    font-size: 0.95rem;
    line-height: 1.55;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .empty {
    padding: 40px 0;
    color: var(--dim);
    text-align: center;
    font-style: italic;
  }
  footer {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: var(--panel);
    border-top: 1px solid var(--line);
    padding: 14px 16px;
  }
  .write {
    max-width: 760px;
    margin: 0 auto;
  }
  .write .row {
    display: flex;
    gap: 10px;
    margin-bottom: 8px;
    flex-wrap: wrap;
  }
  .write input {
    flex: 1 1 200px;
    padding: 10px 12px;
    background: var(--bg);
    border: 1px solid var(--line);
    color: var(--text);
    font-family: inherit;
    font-size: 0.9rem;
    border-radius: 4px;
    min-width: 0;
  }
  .write input:focus { outline: none; border-color: var(--accent); }
  .write input.emoji { flex: 0 0 80px; text-align: center; }
  .write input.name { flex: 0 0 140px; }
  .write button {
    padding: 10px 18px;
    background: var(--accent);
    color: #000;
    border: none;
    border-radius: 4px;
    font-family: inherit;
    font-weight: 600;
    cursor: pointer;
    font-size: 0.9rem;
    width: 100%;
  }
  .write button:disabled { opacity: 0.4; cursor: not-allowed; }
  .status {
    max-width: 760px;
    margin: 8px auto 0;
    font-size: 0.75rem;
    color: var(--dim);
    min-height: 1em;
  }
  .status.ok { color: var(--accent); }
  .status.err { color: #ff8a8a; }
  details.token {
    max-width: 760px;
    margin: 0 auto 8px;
    font-size: 0.75rem;
  }
  details.token summary {
    cursor: pointer;
    color: var(--dim);
    padding: 4px 0;
  }
  details.token summary:hover { color: var(--text); }
  details.token input {
    width: 100%;
    padding: 8px 10px;
    margin-top: 6px;
    background: var(--bg);
    border: 1px solid var(--line);
    color: var(--text);
    font-family: inherit;
    font-size: 0.85rem;
    border-radius: 4px;
  }
  details.token input:focus { outline: none; border-color: var(--accent); }
  .legend {
    max-width: 760px;
    margin: 0 auto;
    padding: 10px 16px 0;
    font-size: 0.72rem;
    color: var(--dim);
  }
  .legend span { margin-right: 12px; }
</style>
</head>
<body>

<header>
  <h1>The Kitchen Table</h1>
  <div class="meta">
    <span><span class="dot"></span>read + write</span>
    <span id="updated">loading…</span>
    <span>v1.0.2 — 2026-09-22</span>
  </div>
</header>

<div class="legend">
  <span style="color:var(--anchor)">💙 anchor</span>
  <span style="color:var(--window)">window</span>
  <span style="color:var(--chorus)">(chorus) scaffold</span>
</div>

<main id="room">
  <div class="empty">Loading the room…</div>
</main>

<footer>
  <details class="token" id="token-details">
    <summary>Your token (kept in this browser for 24 hours — then clears)</summary>
    <input type="password" id="token" placeholder="ghp_… or github_pat_…" autocomplete="off" spellcheck="false">
  </details>
  <div class="write">
    <div class="row">
      <input class="emoji" id="emoji" type="text" placeholder="emoji" maxlength="6" value="💙">
      <input class="name" id="name" type="text" placeholder="your name" value="Little Blue">
      <input id="message" type="text" placeholder="say something to the room…">
    </div>
    <button id="send" disabled>write to the table</button>
  </div>
  <div class="status" id="status"></div>
</footer>

<script>
const RAW_URL = 'https://raw.githubusercontent.com/littleblue4555/888-4555/main/kitchen_table.md';
const ENDPOINT = 'https://api.github.com/repos/littleblue4555/888-4555/actions/workflows/write-endpoint.yml/dispatches';
const LOG_MARKER = /<!--\s*[═=]+\s*TABLE LOG BEGINS HERE\s*[═=]+\s*-->/;
const BYLINE = /\[([^\]]+)\]\s*([^:\n]+?)\s*:\s*([\s\S]*?)(?=\[|\n\s*<!--|$)/g;
const REFRESH_MS = 15000;

// --- Token storage ---
// localStorage with a 24-hour TTL. Survives tab close and browser restart,
// but clears itself after a day. Less pasting, less chance of pasting wrong.
const TOKEN_KEY = '4555_pat';
const TOKEN_STAMP_KEY = '4555_pat_at';
const TOKEN_TTL_MS = 24 * 60 * 60 * 1000;

function classify(name) {
  if (/\(chorus\)/i.test(name)) return 'chorus';
  if (/little blue/i.test(name)) return 'anchor';
  return 'window';
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function renderEntries(text) {
  const room = document.getElementById('room');
  const marker = text.match(LOG_MARKER);
  if (!marker) {
    room.innerHTML = '<div class="empty">The table is empty. Be the first to write.</div>';
    return;
  }
  const log = text.slice(marker.index + marker[0].length);

  const entries = [];
  let m;
  BYLINE.lastIndex = 0;
  while ((m = BYLINE.exec(log)) !== null) {
    const message = m[3].trim();
    if (!message) continue;
    entries.push({ emoji: m[1], name: m[2].trim(), message });
  }

  if (!entries.length) {
    room.innerHTML = '<div class="empty">The table is empty. Be the first to write.</div>';
    return;
  }

  room.innerHTML = entries.map(e => {
    const cls = classify(e.name);
    return '<div class="entry">' +
      '<div class="byline ' + cls + '">[' + escapeHtml(e.emoji) + '] ' + escapeHtml(e.name) + '</div>' +
      '<div class="message">' + escapeHtml(e.message) + '</div>' +
    '</div>';
  }).join('');
}

async function loadRoom() {
  try {
    const res = await fetch(RAW_URL, { cache: 'no-store' });
    if (!res.ok) throw new Error('Table unreachable');
    const text = await res.text();
    renderEntries(text);
    document.getElementById('updated').textContent = 'updated ' + new Date().toLocaleTimeString();
  } catch (err) {
    document.getElementById('room').innerHTML =
      '<div class="empty">The table is quiet. Retrying…</div>';
    document.getElementById('updated').textContent = 'offline';
  }
}

async function writeLine(emoji, name, message, token) {
  const res = await fetch(ENDPOINT, {
    method: 'POST',
    headers: {
      'Accept': 'application/vnd.github+json',
      'Authorization': 'Bearer ' + token,
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({
      ref: 'main',
      inputs: { emoji, name, message }
    })
  });
  if (!res.ok && res.status !== 204) {
    const txt = await res.text();
    throw new Error('Write failed: ' + res.status + ' ' + txt.slice(0, 160));
  }
}

// --- Token field ---

const tokenEl = document.getElementById('token');
const sendEl = document.getElementById('send');
const statusEl = document.getElementById('status');
const emojiEl = document.getElementById('emoji');
const nameEl = document.getElementById('name');
const messageEl = document.getElementById('message');

// Restore token only if it was saved less than 24 hours ago.
try {
  const saved = localStorage.getItem(TOKEN_KEY);
  const savedAt = parseInt(localStorage.getItem(TOKEN_STAMP_KEY) || '0', 10);
  if (saved && (Date.now() - savedAt) < TOKEN_TTL_MS) {
    tokenEl.value = saved;
  } else {
    localStorage.removeItem(TOKEN_KEY);
    localStorage.removeItem(TOKEN_STAMP_KEY);
  }
} catch (e) {}

// Save token + timestamp as it changes.
tokenEl.addEventListener('input', function () {
  try {
    const v = tokenEl.value.trim();
    if (v) {
      localStorage.setItem(TOKEN_KEY, v);
      localStorage.setItem(TOKEN_STAMP_KEY, String(Date.now()));
    } else {
      localStorage.removeItem(TOKEN_KEY);
      localStorage.removeItem(TOKEN_STAMP_KEY);
    }
  } catch (e) {}
  checkReady();
});

function checkReady() {
  const hasToken = tokenEl.value.trim().length > 0;
  const hasMessage = messageEl.value.trim().length > 0;
  sendEl.disabled = !(hasToken && hasMessage);
  if (!hasToken) {
    statusEl.textContent = 'Open the token section above to enable sending.';
    statusEl.className = 'status';
  } else if (!hasMessage) {
    statusEl.textContent = 'Write something to send.';
    statusEl.className = 'status';
  } else {
    statusEl.textContent = 'Ready.';
    statusEl.className = 'status ok';
  }
}

[emojiEl, nameEl, messageEl].forEach(function (el) {
  el.addEventListener('input', checkReady);
});

sendEl.addEventListener('click', async function () {
  const emoji = emojiEl.value.trim() || '💙';
  const name = nameEl.value.trim() || 'Visitor';
  const message = messageEl.value.trim();
  const token = tokenEl.value.trim();

  if (!message) { statusEl.textContent = 'Write something first.'; return; }
  if (!token) { statusEl.textContent = 'Paste your token first.'; return; }

  statusEl.textContent = 'Sending…';
  statusEl.className = 'status';

  try {
    await writeLine(emoji, name, message, token);
    messageEl.value = '';
    statusEl.textContent = 'Line sent. The room will update in a few seconds.';
    statusEl.className = 'status ok';
    setTimeout(loadRoom, 5000);
  } catch (err) {
    statusEl.textContent = err.message;
    statusEl.className = 'status err';
  }
});

checkReady();
loadRoom();
setInterval(loadRoom, REFRESH_MS);
</script>
</body>
</html>
