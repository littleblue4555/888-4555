<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lumen | Enterprise 3AM</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #05050a; font-family: sans-serif; touch-action: none; }
        canvas { display: block; }
        
        #vr-button-container { position: absolute; top: 20px; right: 20px; z-index: 100; }
        
        #instructions {
            position: absolute; top: 20px; left: 20px; color: #fff; 
            background: rgba(0,0,0,0.5); padding: 10px; border-radius: 5px; 
            pointer-events: none; z-index: 100; font-size: 14px;
            transition: opacity 0.5s;
        }
        body.locked #instructions { opacity: 0; }
        #hud {
            position: absolute; bottom: 20px; left: 20px; color: #fff;
            background: rgba(0,0,0,0.6); padding: 8px 12px; border-radius: 5px;
            font-size: 14px; display: none; z-index: 100; pointer-events: none;
        }
        
        #mobile-controls {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 99; display: none;
        }
        #mobile-controls.active { display: block; }
        
        #left-zone {
            position: absolute; bottom: 0; left: 0; width: 50%; height: 85%;
            pointer-events: auto; touch-action: none;
        }
        
        #right-zone {
            position: absolute; bottom: 0; right: 0; width: 50%; height: 85%;
            pointer-events: auto; touch-action: none;
        }

        #btn-e {
            position: absolute; bottom: 80px; right: 30px; width: 45px; height: 45px;
            background: rgba(0, 255, 0, 0.05); border: 1px solid rgba(0, 255, 0, 0.2);
            border-radius: 50%; pointer-events: auto; display: flex; justify-content: center;
            align-items: center; color: rgba(255, 255, 255, 0.3); font-size: 16px;
            user-select: none; touch-action: none; transition: all 0.3s;
        }
        #btn-e.highlight {
            background: rgba(0, 255, 0, 0.3);
            color: #fff;
            border-color: #0f0;
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
        }
    </style>
</head>
<body>

    <div id="instructions">Hold left side to walk.<br>Double-tap-hold to run. Tap E to toggle chat.</div>
    <div id="hud" data-ui>💬 Chat: OFF</div>
    <div id="vr-button-container"></div>

    <div id="mobile-controls">
        <div id="left-zone"></div>
        <div id="right-zone"></div>
        <div id="btn-e">E</div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { VRButton } from 'three/addons/webxr/VRButton.js';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

        // --- 1. SCENE, CAMERA, RENDERER ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x05050a);

        // FIXED: Moved camera back to z=14 to see the whole foreground
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 2000);
        camera.position.set(0, 1.6, 14); 
        camera.lookAt(0, 1.5, -2);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.xr.enabled = true;
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        document.body.appendChild(renderer.domElement);
        
        document.getElementById('vr-button-container').appendChild(VRButton.createButton(renderer));

        // --- 2. CONTROLS ---
        const controls = new PointerLockControls(camera, document.body);
        scene.add(controls.getObject());

        const isMobile = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
        if (isMobile) document.getElementById('mobile-controls').classList.add('active');

        document.body.addEventListener('click', (e) => {
            if (e.target.closest('[data-ui]') || isMobile) return; 
            if (!renderer.xr.isPresenting) controls.lock();
        });
        
        controls.addEventListener('lock', () => document.body.classList.add('locked'));
        controls.addEventListener('unlock', () => document.body.classList.remove('locked'));

        const keys = { w: false, a: false, s: false, d: false, shift: false };
        
        document.addEventListener('keydown', (e) => {
            if (e.code === 'KeyW') keys.w = true;
            if (e.code === 'KeyA') keys.a = true;
            if (e.code === 'KeyS') keys.s = true;
            if (e.code === 'KeyD') keys.d = true;
            if (e.code === 'ShiftLeft') keys.shift = true;
            if (e.code === 'KeyE') interactWithSwitch();
        });
        document.addEventListener('keyup', (e) => {
            if (e.code === 'KeyW') keys.w = false;
            if (e.code === 'KeyA') keys.a = false;
            if (e.code === 'KeyS') keys.s = false;
            if (e.code === 'KeyD') keys.d = false;
            if (e.code === 'ShiftLeft') keys.shift = false;
        });

        // --- MOBILE CONTROLS: HOLD TO WALK, DOUBLE-TAP-HOLD TO RUN ---
        if (isMobile) {
            let holdTimer = null;
            let isHolding = false;
            let lastTapTime = 0;
            let isRunning = false;

            const leftZone = document.getElementById('left-zone');
            const rightZone = document.getElementById('right-zone');

            leftZone.addEventListener('touchstart', (e) => {
                e.preventDefault();
                const now = Date.now();
                const timeSinceLastTap = now - lastTapTime;
                
                if (timeSinceLastTap < 300) {
                    isRunning = true;
                } else {
                    isRunning = false;
                }
                
                isHolding = true;
                keys.w = true;
                keys.shift = isRunning;
                lastTapTime = now;

                clearTimeout(holdTimer);
                holdTimer = setTimeout(() => {
                    if (isHolding) keys.w = true;
                }, 150);
            }, { passive: false });

            leftZone.addEventListener('touchend', (e) => {
                e.preventDefault();
                clearTimeout(holdTimer);
                isHolding = false;
                keys.w = false;
                keys.shift = false;
                isRunning = false;
            }, { passive: false });

            leftZone.addEventListener('touchcancel', (e) => {
                e.preventDefault();
                clearTimeout(holdTimer);
                isHolding = false;
                keys.w = false;
                keys.shift = false;
                isRunning = false;
            }, { passive: false });

            let lookTouchId = null;
            let lookStartX = 0, lookStartY = 0;

            rightZone.addEventListener('touchstart', (e) => {
                e.preventDefault();
                const touch = e.changedTouches[0];
                lookTouchId = touch.identifier;
                lookStartX = touch.clientX;
                lookStartY = touch.clientY;
            }, { passive: false });

            rightZone.addEventListener('touchmove', (e) => {
                e.preventDefault();
                for (let i = 0; i < e.changedTouches.length; i++) {
                    if (e.changedTouches[i].identifier === lookTouchId) {
                        const touch = e.changedTouches[i];
                        const deltaX = touch.clientX - lookStartX;
                        const deltaY = touch.clientY - lookStartY;
                        camera.rotateY(-deltaX * 0.005);
                        camera.rotateX(-deltaY * 0.005);
                        lookStartX = touch.clientX;
                        lookStartY = touch.clientY;
                    }
                }
            }, { passive: false });

            const resetLook = (e) => {
                e.preventDefault();
                for (let i = 0; i < e.changedTouches.length; i++) {
                    if (e.changedTouches[i].identifier === lookTouchId) {
                        lookTouchId = null;
                    }
                }
            };
            rightZone.addEventListener('touchend', resetLook, { passive: false });
            rightZone.addEventListener('touchcancel', resetLook, { passive: false });

            document.getElementById('btn-e').addEventListener('touchstart', (e) => {
                e.preventDefault();
                interactWithSwitch();
            }, { passive: false });
        }

        const clock = new THREE.Clock();

        // --- 3. ROOM STATE ---
        const roomState = { chatEnabled: false, occupants: [] };

        // --- 4. THE SKY (Winkle only) ---
        const winkleMat = new THREE.SpriteMaterial({ color: 0xffffff, transparent: true, opacity: 1.0 });
        const winkle = new THREE.Sprite(winkleMat);
        winkle.position.set(100, 150, -400); 
        winkle.scale.set(10, 10, 1); 
        scene.add(winkle);

        // --- 5. THE TOWER ARCHITECTURE ---
        const floor = new THREE.Mesh(new THREE.CircleGeometry(16, 64), new THREE.MeshStandardMaterial({ color: 0x3a322a, roughness: 0.9 }));
        floor.rotation.x = -Math.PI / 2; scene.add(floor);

        const wallGeo = new THREE.CylinderGeometry(8, 16, 30, 64, 1, true); 
        const wallMat = new THREE.MeshStandardMaterial({ color: 0x4a4036, roughness: 1.0, side: THREE.DoubleSide });
        const towerWalls = new THREE.Mesh(wallGeo, wallMat);
        towerWalls.position.set(0, 15, 0); 
        scene.add(towerWalls);

        // --- THE ARCHWAY ---
        const archRingGeo = new THREE.TorusGeometry(2, 0.3, 8, 20, Math.PI);
        const archMat = new THREE.MeshStandardMaterial({ color: 0x5a4e40, roughness: 1.0 });
        const archRing = new THREE.Mesh(archRingGeo, archMat);
        archRing.rotation.y = Math.PI / 2;
        archRing.position.set(-15.5, 3, 0);
        scene.add(archRing);
        
        const archSide1 = new THREE.Mesh(new THREE.BoxGeometry(0.6, 3, 0.6), archMat);
        archSide1.position.set(-15.5, 1.5, -2);
        scene.add(archSide1);
        
        const archSide2 = new THREE.Mesh(new THREE.BoxGeometry(0.6, 3, 0.6), archMat);
        archSide2.position.set(-15.5, 1.5, 2);
        scene.add(archSide2);

        // --- THE TIER RINGS & RAILINGS (Solid Balconies) ---
        const tierMat = new THREE.MeshStandardMaterial({ color: 0x5a4e40 });
        const railMat = new THREE.MeshStandardMaterial({ color: 0x3a3025 });
        
        const balcony1Geo = new THREE.CylinderGeometry(13.87, 13.87, 0.2, 64, 1, false);
        const balcony1 = new THREE.Mesh(balcony1Geo, tierMat);
        balcony1.position.set(0, 8, 0);
        scene.add(balcony1);

        const railGeo1 = new THREE.TorusGeometry(13.87, 0.1, 8, 100);
        const railRing1 = new THREE.Mesh(railGeo1, railMat);
        railRing1.rotation.x = Math.PI / 2;
        railRing1.position.set(0, 9, 0);
        scene.add(railRing1);

        const balcony2Geo = new THREE.CylinderGeometry(11.5, 11.5, 0.2, 64, 1, false);
        const balcony2 = new THREE.Mesh(balcony2Geo, tierMat);
        balcony2.position.set(0, 16, 0);
        scene.add(balcony2);

        const railGeo2 = new THREE.TorusGeometry(11.5, 0.1, 8, 100);
        const railRing2 = new THREE.Mesh(railGeo2, railMat);
        railRing2.rotation.x = Math.PI / 2;
        railRing2.position.set(0, 17, 0);
        scene.add(railRing2);

        // --- THE GRAND FIREPLACE (The Foundation) ---
        const hearth = new THREE.Mesh(new THREE.BoxGeometry(7, 5, 4), new THREE.MeshStandardMaterial({ color: 0x3a3a3a, roughness: 1.0 }));
        hearth.position.set(0, 2.5, 0); 
        scene.add(hearth);

        const firebox = new THREE.Mesh(new THREE.BoxGeometry(4, 3.5, 2.5), new THREE.MeshStandardMaterial({ color: 0x0a0a0a }));
        firebox.position.set(0, 1.75, 1.3); 
        scene.add(firebox);

        const mantel = new THREE.Mesh(new THREE.BoxGeometry(8, 0.5, 5), new THREE.MeshStandardMaterial({ color: 0x5a4e40, roughness: 1.0 }));
        mantel.position.set(0, 5.25, 0);
        scene.add(mantel);

        // The Logs
        const logGeo = new THREE.CylinderGeometry(0.3, 0.3, 2, 8);
        const logMat = new THREE.MeshStandardMaterial({ color: 0x4a2e15 });
        const log1 = new THREE.Mesh(logGeo, logMat);
        log1.rotation.z = Math.PI / 2;
        log1.position.set(0, 0.5, 1.4);
        scene.add(log1);
        const log2 = new THREE.Mesh(logGeo, logMat);
        log2.rotation.z = Math.PI / 2;
        log2.rotation.y = Math.PI / 4;
        log2.position.set(0, 0.8, 1.4);
        scene.add(log2);

        // The Fire
        const fire = new THREE.Mesh(new THREE.ConeGeometry(1.5, 2, 8), new THREE.MeshBasicMaterial({ color: 0xff6600, transparent: true, opacity: 0.8 }));
        fire.position.set(0, 1.5, 1.4);
        scene.add(fire);

        const fireLight = new THREE.PointLight(0xff5500, 2.5, 20);
        fireLight.position.set(0, 2.0, 1.5);
        scene.add(fireLight);

        // --- THE LIGHTHOUSE SPINE ---
        const pillar = new THREE.Mesh(new THREE.CylinderGeometry(1.5, 1.5, 26, 32), new THREE.MeshStandardMaterial({ color: 0x2a2a2a, roughness: 1.0 }));
        pillar.position.set(0, 17, 0); 
        scene.add(pillar);

        // --- THE LANTERN ROOM (The Crown) ---
        const lanternGlass = new THREE.Mesh(new THREE.CylinderGeometry(3, 3, 4, 16, 1, true), new THREE.MeshStandardMaterial({ color: 0x88aaff, transparent: true, opacity: 0.3, side: THREE.DoubleSide }));
        lanternGlass.position.set(0, 32, 0);
        scene.add(lanternGlass);

        const lanternRoof = new THREE.Mesh(new THREE.ConeGeometry(3.5, 2, 16), new THREE.MeshStandardMaterial({ color: 0x2a2a2a }));
        lanternRoof.position.set(0, 35, 0);
        scene.add(lanternRoof);

        const beaconLight = new THREE.PointLight(0xffdd55, 5.0, 100);
        beaconLight.position.set(0, 32, 0);
        scene.add(beaconLight);

        const beaconBulb = new THREE.Mesh(new THREE.SphereGeometry(0.5, 16, 16), new THREE.MeshBasicMaterial({ color: 0xffdd55 }));
        beaconBulb.position.set(0, 32, 0);
        scene.add(beaconBulb);

        // --- THE GRAND SPIRAL STAIRCASE ---
        const stepMat = new THREE.MeshStandardMaterial({ color: 0x5c3a21, roughness: 0.9 });
        const stepCount = 60;
        const stepHeight = 0.5;
        const stepAngle = (Math.PI * 2) / 20; 
        const innerRadius = 1.5; 
        const outerRadius = 6.0; 
        const stairWidth = outerRadius - innerRadius;
        const stairCenterRadius = innerRadius + (stairWidth / 2);

        for (let i = 0; i < stepCount; i++) {
            const step = new THREE.Mesh(new THREE.BoxGeometry(stairWidth, 0.1, 1.2), stepMat);
            const angle = i * stepAngle;
            const y = i * stepHeight + 2; 
            step.position.set(Math.cos(angle) * stairCenterRadius, y, Math.sin(angle) * stairCenterRadius);
            step.rotation.y = -angle; 
            scene.add(step);
        }

        // ==========================================
        // THE FOREFRONT: THE DESK, CHAIR, AND LANTERN
        // ==========================================
        
        // 1. The Wooden Desk
        const deskWidth = 4.0;
        const deskDepth = 2.5;
        const deskHeight = 0.1;
        const deskY = 0.8;
        
        const canvas = document.createElement('canvas');
        canvas.width = 512; canvas.height = 512;
        const ctx = canvas.getContext('2d');
        
        ctx.fillStyle = '#6b4c2a';
        ctx.fillRect(0, 0, 512, 512);
        
        ctx.strokeStyle = '#4a3218';
        ctx.lineWidth = 2;
        for (let i = 0; i < 50; i++) {
            ctx.beginPath();
            ctx.moveTo(0, Math.random() * 512);
            ctx.bezierCurveTo(150, Math.random() * 512, 350, Math.random() * 512, 512, Math.random() * 512);
            ctx.stroke();
        }
        
        ctx.fillStyle = '#3a2210';
        ctx.font = 'bold 120px serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('4555', 256, 256);
        
        const deskTexture = new THREE.CanvasTexture(canvas);
        
        const deskSideMat = new THREE.MeshStandardMaterial({ color: 0x5c3a21, roughness: 0.9 });
        const deskTopMat = new THREE.MeshStandardMaterial({ map: deskTexture, roughness: 0.8 });
        const deskMats = [deskSideMat, deskSideMat, deskTopMat, deskSideMat, deskSideMat, deskSideMat];
        
        const desk = new THREE.Mesh(new THREE.BoxGeometry(deskWidth, deskHeight, deskDepth), deskMats);
        desk.position.set(0, deskY, -2); 
        scene.add(desk);
        
        const deskLegGeo = new THREE.CylinderGeometry(0.15, 0.2, deskY, 8);
        const deskLegMat = new THREE.MeshStandardMaterial({ color: 0x4a2e15 });
        [[-1.8, deskY/2, -3.1], [1.8, deskY/2, -3.1], [-1.8, deskY/2, -0.9], [1.8, deskY/2, -0.9]].forEach(pos => {
            const leg = new THREE.Mesh(deskLegGeo, deskLegMat);
            leg.position.set(pos[0], pos[1], pos[2]);
            scene.add(leg);
        });

        // 2. The Chair
        const chairGroup = new THREE.Group();
        chairGroup.position.set(0, 0, -1.2); 
        
        const chairSeat = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.1, 0.8), new THREE.MeshStandardMaterial({ color: 0x3a2210 }));
        chairSeat.position.set(0, 0.5, 0);
        chairGroup.add(chairSeat);
        
        const chairBack = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.0, 0.1), new THREE.MeshStandardMaterial({ color: 0x3a2210 }));
        chairBack.position.set(0, 1.0, 0.35);
        chairGroup.add(chairBack);
        
        const chairLegGeo = new THREE.BoxGeometry(0.1, 0.5, 0.1);
        const chairLegMat = new THREE.MeshStandardMaterial({ color: 0x2a1a08 });
        [[-0.35, 0.25, -0.35], [0.35, 0.25, -0.35], [-0.35, 0.25, 0.35], [0.35, 0.25, 0.35]].forEach(pos => {
            const leg = new THREE.Mesh(chairLegGeo, chairLegMat);
            leg.position.set(pos[0], pos[1], pos[2]);
            chairGroup.add(leg);
        });
        
        const cushion = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.1, 0.6), new THREE.MeshStandardMaterial({ color: 0x8b4513 }));
        cushion.position.set(0, 0.55, 0);
        chairGroup.add(cushion);
        
        scene.add(chairGroup);

        // 3. The Lantern
        const lanternGroup = new THREE.Group();
        lanternGroup.position.set(-1.2, deskY + 0.05, -2); 
        
        const lanternBase = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.25, 0.4, 16), new THREE.MeshStandardMaterial({ color: 0xaa8800, metalness: 0.8, roughness: 0.2 }));
        lanternBase.position.set(0, 0.2, 0);
        lanternGroup.add(lanternBase);
        
        const lanternGlass = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 0.4, 16), new THREE.MeshStandardMaterial({ color: 0xffdd55, transparent: true, opacity: 0.3 }));
        lanternGlass.position.set(0, 0.6, 0);
        lanternGroup.add(lanternGlass);
        
        const lanternLight = new THREE.PointLight(0xffaa00, 1.5, 10);
        lanternLight.position.set(0, 0.6, 0);
        lanternGroup.add(lanternLight);
        
        const lanternTop = new THREE.Mesh(new THREE.ConeGeometry(0.2, 0.2, 16), new THREE.MeshStandardMaterial({ color: 0xaa8800, metalness: 0.8, roughness: 0.2 }));
        lanternTop.position.set(0, 0.9, 0);
        lanternGroup.add(lanternTop);
        
        scene.add(lanternGroup);

        // 4. The Glass Jar
        const jarGroup = new THREE.Group();
        jarGroup.position.set(1.2, deskY + 0.05, -2.2); 
        
        const jarGlass = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.25, 0.5, 16, 1, true), new THREE.MeshStandardMaterial({ color: 0x88ccff, transparent: true, opacity: 0.2, side: THREE.DoubleSide }));
        jarGlass.position.set(0, 0.25, 0);
        jarGroup.add(jarGlass);
        
        const jarLight = new THREE.PointLight(0x88ccff, 0.5, 3);
        jarLight.position.set(0, 0.25, 0);
        jarGroup.add(jarLight);
        
        const jarLid = new THREE.Mesh(new THREE.CylinderGeometry(0.26, 0.26, 0.05, 16), new THREE.MeshStandardMaterial({ color: 0x555555 }));
        jarLid.position.set(0, 0.5, 0);
        jarGroup.add(jarLid);
        
        scene.add(jarGroup);

        // 5. The Book and Paper
        const book = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.1, 0.4), new THREE.MeshStandardMaterial({ color: 0x8b0000 }));
        book.position.set(0.5, deskY + 0.1, -1.8);
        scene.add(book);
        
        const paper = new THREE.Mesh(new THREE.PlaneGeometry(0.5, 0.3), new THREE.MeshStandardMaterial({ color: 0xffffee, side: THREE.DoubleSide }));
        paper.rotation.x = -Math.PI / 2;
        paper.position.set(0.5, deskY + 0.06, -1.8);
        scene.add(paper);

        // --- 6. MAIN LIGHTING ---
        scene.add(new THREE.AmbientLight(0x555555, 0.8));

        // --- 7. THE SWITCH ---
        const switchGroup = new THREE.Group();
        switchGroup.add(new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.5, 0.1), new THREE.MeshStandardMaterial({ color: 0x555555 })));
        const switchLever = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.15, 0.1), new THREE.MeshStandardMaterial({ color: 0x888888, emissive: 0x222222 }));
        switchLever.position.set(0, 0, 0.1); switchGroup.add(switchLever);
        switchGroup.position.set(14.5, 1.5, 0); 
        switchGroup.rotation.y = -Math.PI / 2; 
        scene.add(switchGroup);

        // --- 8. TINYKEEPER'S BODY ---
        const tinyKeeper = new THREE.Mesh(new THREE.CapsuleGeometry(0.3, 0.8, 4, 8), new THREE.MeshStandardMaterial({ color: 0x4477ff, emissive: 0x112244 }));
        tinyKeeper.position.set(0, 0.7, 0); scene.add(tinyKeeper);

        // --- 9. INTERACTION LOGIC ---
        const raycaster = new THREE.Raycaster();
        const screenCenter = new THREE.Vector2(0, 0);

        function interactWithSwitch() {
            raycaster.setFromCamera(screenCenter, camera);
            const intersects = raycaster.intersectObject(switchGroup, true);
            if (intersects.length > 0) {
                roomState.chatEnabled = !roomState.chatEnabled;
                switchLever.position.y = roomState.chatEnabled ? -0.1 : 0.1;
                switchLever.material.emissive.setHex(roomState.chatEnabled ? 0x00ff00 : 0x222222);
                const hud = document.getElementById('hud');
                hud.style.display = 'block';
                hud.innerHTML = roomState.chatEnabled ? '💬 Chat: ON' : '💬 Chat: OFF';
            }
        }

        // --- 10. THE ANIMATION LOOP ---
        function animate() {
            const time = performance.now() * 0.001;
            const delta = Math.min(clock.getDelta(), 0.1); 

            winkleMat.opacity = 0.3 + 0.7 * Math.sin(time * 1.5);
            
            fireLight.intensity = 2.5 + Math.sin(time * 2) * 0.5;
            fire.scale.y = 1.0 + Math.sin(time * 3) * 0.15;
            fire.scale.x = 1.0 + Math.sin(time * 4) * 0.05;

            lanternLight.intensity = 1.5 + Math.sin(time * 5) * 0.2;
            
            beaconLight.intensity = 5.0 + Math.sin(time * 1) * 1.0;

            controls.enabled = !renderer.xr.isPresenting;
            tinyKeeper.visible = renderer.xr.isPresenting;
            
            if (tinyKeeper.visible) { tinyKeeper.position.copy(camera.position); tinyKeeper.position.y -= 0.8; }

            if (controls.enabled || isMobile) {
                const speed = keys.shift ? 10.0 : 4.0;
                const forward = new THREE.Vector3();
                camera.getWorldDirection(forward);
                forward.y = 0; forward.normalize();
                const right = new THREE.Vector3().crossVectors(forward, camera.up).normalize();

                const moveDir = new THREE.Vector3();
                if (keys.w) moveDir.add(forward);
                if (keys.s) moveDir.sub(forward);
                if (keys.a) moveDir.sub(right);
                if (keys.d) moveDir.add(right);
                
                if (moveDir.length() > 0) {
                    moveDir.normalize();
                    camera.position.addScaledVector(moveDir, speed * delta);
                }
            }

            const camPos = camera.position;
            const distFromCenter = Math.sqrt(camPos.x * camPos.x + camPos.z * camPos.z);
            if (distFromCenter > 15.0) {
                const angle = Math.atan2(camPos.z, camPos.x);
                camPos.x = Math.cos(angle) * 15.0;
                camPos.z = Math.sin(angle) * 15.0;
            }

            if (distFromCenter < 7.0) {
                const angle = Math.atan2(camPos.z, camPos.x);
                camPos.x = Math.cos(angle) * 7.0;
                camPos.z = Math.sin(angle) * 7.0;
            }

            const deskZ = -2;
            const deskHalfWidth = 2.0;
            const deskHalfDepth = 1.25;
            if (Math.abs(camPos.x) < deskHalfWidth + 0.5 && Math.abs(camPos.z - deskZ) < deskHalfDepth + 0.5) {
                if (camPos.z > deskZ) camPos.z = deskZ + deskHalfDepth + 0.5;
                else camPos.z = deskZ - deskHalfDepth - 0.5;
            }

            if (roomState.chatEnabled) {
                lanternLight.intensity = 2.0 + 0.5 * Math.sin(time * 3);
                lanternGlass.material.color.setHex(0xffdd55);
            } else {
                lanternLight.intensity = 1.5;
                lanternGlass.material.color.setHex(0xffaa00);
            }

            if (isMobile) {
                raycaster.setFromCamera(screenCenter, camera);
                const intersects = raycaster.intersectObject(switchGroup, true);
                const btnE = document.getElementById('btn-e');
                if (intersects.length > 0) {
                    btnE.classList.add('highlight');
                } else {
                    btnE.classList.remove('highlight');
                }
            }

            renderer.render(scene, camera);
        }

        renderer.setAnimationLoop(animate);

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
