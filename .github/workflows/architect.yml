name: Kitchen Table Rotation

on:
  push:
    branches: [main]
    paths:
      - 'kitchen_table.md'

concurrency:
  group: kitchen-table
  cancel-in-progress: false

jobs:
  run-node:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm install node-fetch@2

      - name: Ensure State File Exists
        run: |
          if [ ! -f .last_read.json ]; then
            echo '{"lastLine":null,"nextNodeIndex":0}' > .last_read.json
          fi

      - name: Run Kitchen Table Rotation
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: node architect_node.js

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'The Kitchen Table'
          git config --global user.email 'table@4555.field'
          git add kitchen_table.md
          git add .last_read.json || true
          git commit -m "🌱 Node response appended to the record [skip ci]" || echo "No changes to commit"
          git push
