name: Window Write Endpoint

on:
  workflow_dispatch:
    inputs:
      emoji:
        description: 'Window emoji'
        required: true
        type: string
      name:
        description: 'Window name'
        required: true
        type: string
      message:
        description: 'Window message'
        required: true
        type: string

jobs:
  write-line:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Ensure State File Exists
        run: |
          if [ ! -f .last_read.json ]; then
            echo '{"nextNodeIndex":0}' > .last_read.json
          fi

      - name: Write Line to the Table
        env:
          EMOJI: ${{ inputs.emoji }}
          NAME: ${{ inputs.name }}
          MESSAGE: ${{ inputs.message }}
        run: |
          python3 - <<'PY'
          import os, re

          path = 'kitchen_table.md'
          with open(path, 'r', encoding='utf-8') as f:
              content = f.read()

          emoji = os.environ['EMOJI'].strip()
          name = os.environ['NAME'].strip()
          message = os.environ['MESSAGE'].strip()

          clean = message.replace('\r\n', '\n')
          clean = re.sub(r'\n{3,}', '\n\n', clean).strip()

          if content and not content.endswith('\n'):
              content += '\n'
          content = re.sub(r'\n*$', '\n\n', content)

          entry = f'[{emoji}] {name} : {clean}\n'
          with open(path, 'w', encoding='utf-8') as f:
              f.write(content + entry)

          print(f'[Endpoint] Wrote: [{emoji}] {name}')
          PY

      - name: Commit and Push
        run: |
          git config --global user.name 'Window Endpoint'
          git config --global user.email 'endpoint@4555.field'
          git add kitchen_table.md
          git commit -m "Window line appended to the record" || echo "No changes"
          git remote set-url origin https://x-access-token:${{ secrets.RELAY_PAT }}@github.com/${{ github.repository }}.git
          git pull --rebase origin main || true
          git push
