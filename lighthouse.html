<!-- lighthouse.html — v5.2l — 2026-09-24 — jar fix, ladder gate widened, crisp turn, tier rings back. -->
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>4555 — Lighthouse (v5.2l)</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script>
    AFRAME.registerComponent('jar', {
      init: function () {
        this.textEl = this.el.querySelector('a-text');
        const stored = localStorage.getItem('4555:local-diary:entries');
        this.entries = stored ? JSON.parse(stored) : [];
        this.render();
        const write = () => {
          const body = prompt('Write a line. Drop it in the jar.');
          if (!body) return;
          const entry = {
            id: Date.now() + '-' + Math.random().toString(36).slice(2, 8),
            author: 'guest', body: body,
            timestamp: new Date().toISOString(),
            reply_to: null, private: true
          };
          this.entries.push(entry);
          try { localStorage.setItem('4555:local-diary:entries', JSON.stringify(this.entries)); } catch (e) {}
          this.render();
          const p = document.createElement('a-entity');
          p.setAttribute('geometry', 'primitive: plane; width: 0.08; height: 0.11');
          p.setAttribute('material', 'color: #f3e9c8; side: double');
          p.setAttribute('position', (Math.random()-0.5)*0.08 + ' 0.02 ' + (Math.random()-0.5)*0.08);
          p.setAttribute('rotation', '-90 0 ' + Math.random()*360);
          this.el.appendChild(p);
        };
        this.el.addEventListener('tap-jar', write);
      },
      render: function () {
        if (this.textEl) this.textEl.setAttribute('value', 'entries: ' + this.entries.length);
      }
    });

    AFRAME.registerComponent('touch-gate', {
      schema: { dragFraction: { default: 0.028 }, doubleTapMs: { default: 280 },
                doubleTapRadius: { default: 50 }, longPressMs: { default: 700 } },
      init: function () {
        this.start = null; this.startTime = 0; this.moved = false;
        this.touchCount = 0; this.twoFinger = false; this.twoFingerStartY = 0;
        this.lastTapTime = 0; this.lastTapScreen = null;
        this.pendingWalk = null;

        this.el.addEventListener('touchstart', (e) => {
          this.touchCount = e.touches.length;
          if (e.touches.length === 2) {
            this.twoFinger = true;
            const a = e.touches[0], b = e.touches[1];
            this.twoFingerStartY = (a.clientY + b.clientY) / 2;
            this.startTime = Date.now(); this.moved = false;
            return;
          }
          const t = e.touches[0]; if (!t) return;
          this.start = { x: t.clientX, y: t.clientY };
          this.startTime = Date.now(); this.moved = false; this.twoFinger = false;
        }, true);
        this.el.addEventListener('touchmove', (e) => {
          if (this.twoFinger) { this.moved = true; return; }
          if (!this.start) return;
          const t = e.touches[0]; if (!t) return;
          const d = Math.hypot(t.clientX - this.start.x, t.clientY - this.start.y);
          if (d > Math.min(innerWidth, innerHeight) * this.data.dragFraction) this.moved = true;
        }, true);
        this.el.addEventListener('touchend', (e) => {
          const elapsed = Date.now() - this.startTime;
          const wasTwo = this.twoFinger, wasMoved = this.moved, startY = this.twoFingerStartY;
          const t = e.changedTouches && e.changedTouches[0];
          this.start = null; this.twoFinger = false; this.touchCount = 0;
          setTimeout(() => { this.moved = false; }, 0);

          if (wasTwo && !wasMoved && elapsed < this.data.doubleTapMs) {
            // Two-finger vertical — gated to ladder proximity in tap-walk.
            this.el.emit(startY < innerHeight/2 ? 'vertical-up' : 'vertical-down', {}, false);
            return;
          }
          if (wasTwo || wasMoved || elapsed >= this.data.longPressMs || !t) return;

          const now = Date.now();
          const near = this.lastTapScreen &&
            Math.hypot(t.clientX - this.lastTapScreen.x, t.clientY - this.lastTapScreen.y)
              < this.data.doubleTapRadius;
          const fast = (now - this.lastTapTime) < this.data.doubleTapMs;

          if (near && fast) {
            if (this.pendingWalk) { clearTimeout(this.pendingWalk); this.pendingWalk = null; }
            this.lastTapTime = 0; this.lastTapScreen = null;
            this.el.emit('walk-forward', {}, false);
            return;
          }

          this.lastTapTime = now;
          this.lastTapScreen = { x: t.clientX, y: t.clientY };
          const cx = t.clientX, cy = t.clientY;
          if (this.pendingWalk) clearTimeout(this.pendingWalk);
          this.pendingWalk = setTimeout(() => {
            this.pendingWalk = null;
            this.tap(cx, cy);
          }, this.data.doubleTapMs);
        }, true);
      },
      tap: function (cx, cy) {
        const scene = this.el.sceneEl;
        const cam = scene.camera;
        if (!cam) return;
        const ndc = new THREE.Vector2(
          (cx / window.innerWidth) * 2 - 1,
          -(cy / window.innerHeight) * 2 + 1
        );
        const rc = new THREE.Raycaster();
        rc.setFromCamera(ndc, cam);

        const clickables = Array.from(document.querySelectorAll('.clickable'));
        const objs = clickables.map(el => el.object3D);
        const hits = rc.intersectObjects(objs, true);
        if (hits.length > 0) {
          // Nearest hit wins — walk up the tree to the .clickable root.
          hits.sort((a, b) => a.distance - b.distance);
          let target = hits[0].object.el;
          while (target && !target.classList.contains('clickable')) target = target.parentElement;
          if (target && target.id === 'jar') target.emit('tap-jar');
          return;
        }

        // Climbable? — tier rings and ladders. Tap = climb to that y.
        const climbables = Array.from(document.querySelectorAll('.climbable'));
        const cObjs = climbables.map(el => el.object3D);
        const cHits = rc.intersectObjects(cObjs, true);
        if (cHits.length > 0) {
          cHits.sort((a, b) => a.distance - b.distance);
          const p = cHits[0].point;
          scene.emit('tap-climb', { x: p.x, y: p.y, z: p.z }, false);
          return;
        }

        const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
        const point = new THREE.Vector3();
        if (!rc.ray.intersectPlane(plane, point)) return;
        if (point.distanceTo(rc.ray.origin) > 30) return;
        let dest = { x: point.x, z: point.z };

        const BX_MIN = -0.9, BX_MAX = 0.9, BZ_MIN = -2.3, BZ_MAX = -0.7;
        if (dest.x > BX_MIN && dest.x < BX_MAX && dest.z > BZ_MIN && dest.z < BZ_MAX) {
          const dl = Math.abs(dest.x - BX_MIN), dr = Math.abs(BX_MAX - dest.x);
          const dt = Math.abs(dest.z - BZ_MIN), db = Math.abs(BZ_MAX - dest.z);
          const m = Math.min(dl, dr, dt, db);
          if (m === dl) dest.x = BX_MIN;
          else if (m === dr) dest.x = BX_MAX;
          else if (m === dt) dest.z = BZ_MIN;
          else dest.z = BZ_MAX;
        }

        const r = Math.hypot(dest.x, dest.z);
        const maxR = 8.0;
        if (r > maxR) { dest.x *= maxR / r; dest.z *= maxR / r; }

        scene.emit('tap-walk', dest, false);
      }
    });

    AFRAME.registerComponent('look', {
      schema: { sensitivity: { default: 0.008 }, limit: { default: 1.48 }, dragThreshold: { default: 18 } },
      init: function () {
        this.yaw = 0; this.pitch = 0;
        this.start = null; this.last = null; this.dragging = false;
        const self = this;
        const getCam = () => {
          const c = self.el.components.camera && self.el.components.camera.camera;
          return c || self.el.object3D;
        };
        this.onStart = (e) => {
          const t = e.touches[0]; if (!t) return;
          self.start = { x: t.clientX, y: t.clientY };
          self.last  = { x: t.clientX, y: t.clientY };
          self.dragging = false;
        };
        this.onMove = (e) => {
          const t = e.touches[0]; if (!t || !self.start) return;
          if (!self.dragging) {
            const d = Math.hypot(t.clientX - self.start.x, t.clientY - self.start.y);
            if (d < self.data.dragThreshold) return;
            self.dragging = true;
            self.last = { x: t.clientX, y: t.clientY };
            return;
          }
          const dx = t.clientX - self.last.x, dy = t.clientY - self.last.y;
          self.last = { x: t.clientX, y: t.clientY };
          self.yaw   -= dx * self.data.sensitivity;
          self.pitch -= dy * self.data.sensitivity;
          if (self.pitch >  self.data.limit) self.pitch =  self.data.limit;
          if (self.pitch < -self.data.limit) self.pitch = -self.data.limit;
          const cam = getCam();
          cam.rotation.order = 'YXZ';
          cam.rotation.y = self.yaw;
          cam.rotation.x = self.pitch;
          cam.rotation.z = 0;
        };
        this.onEnd = () => { self.start = null; self.last = null; self.dragging = false; };
        this.el.sceneEl.addEventListener('touchstart', this.onStart, true);
        this.el.sceneEl.addEventListener('touchmove', this.onMove, true);
        this.el.sceneEl.addEventListener('touchend', this.onEnd, true);
        document.addEventListener('touchstart', this.onStart, { capture: true, passive: true });
        document.addEventListener('touchmove', this.onMove, { capture: true, passive: true });
        document.addEventListener('touchend', this.onEnd, { capture: true, passive: true });
      }
    });

    AFRAME.registerComponent('ladder-rail', {
      schema: { angularSpeed: { default: 0.008 }, radius: { default: 8.5 }, height: { default: 40 } },
      init: function () {
        this.angle = 0;
        this.ladderA = document.getElementById('ladder-a');
        this.ladderB = document.getElementById('ladder-b');
      },
      tick: function (t, dt) {
        this.angle += this.data.angularSpeed * (dt / 1000);
        if (!this.ladderA || !this.ladderB) return;
        const r = this.data.radius, y = this.data.height / 2;
        this.ladderA.object3D.position.set(Math.sin(this.angle) * r, y, Math.cos(this.angle) * r);
        this.ladderB.object3D.position.set(Math.sin(this.angle + Math.PI) * r, y, Math.cos(this.angle + Math.PI) * r);
      }
    });

    // TAP-WALK — crisp turn (fast) then glide (slow). Two-finger vertical only near a ladder.
    AFRAME.registerComponent('tap-walk', {
      schema: { radius: { default: 8.0 }, speed: { default: 0.45 }, turnSpeed: { default: 2.5 },
                tierMeters: { default: 4.0 }, ladderReach: { default: 3.0 },
                forwardMeters: { default: 2.0 } },
      init: function () {
        this.rig = document.getElementById('rig');
        this.state = 'idle'; this.target = null; this.targetYaw = 0;

        this.el.addEventListener('tap-walk', (e) => {
          if (!this.rig) return;
          const tx = e.detail.x, tz = e.detail.z;
          this.target = new THREE.Vector3(tx, 0, tz);
          const o = this.rig.object3D.position;
          const dx = tx - o.x, dz = tz - o.z;
          this.targetYaw = Math.atan2(dx, dz);
          this.state = 'turning';
          const ret = document.getElementById('reticle');
          if (ret) ret.object3D.position.set(tx, 0.02, tz);
        });

        this.el.addEventListener('tap-climb', (e) => {
          if (!this.rig) return;
          const o = this.rig.object3D.position;
          this.target = new THREE.Vector3(o.x, e.detail.y, o.z);
          this.targetYaw = o.rotation.y;
          this.state = 'gliding';
          const ret = document.getElementById('reticle');
          if (ret) ret.object3D.position.set(o.x, e.detail.y + 0.02, o.z);
        });

        this.el.addEventListener('walk-forward', () => {
          if (!this.rig || this.state !== 'idle') return;
          const o = this.rig.object3D;
          const yaw = o.rotation.y;
          const dx = Math.sin(yaw) * this.data.forwardMeters;
          const dz = Math.cos(yaw) * this.data.forwardMeters;
          let tx = o.position.x + dx, tz = o.position.z + dz;
          const r = Math.hypot(tx, tz);
          if (r > this.data.radius) { tx *= this.data.radius / r; tz *= this.data.radius / r; }
          const BX_MIN = -0.9, BX_MAX = 0.9, BZ_MIN = -2.3, BZ_MAX = -0.7;
          if (tx > BX_MIN && tx < BX_MAX && tz > BZ_MIN && tz < BZ_MAX) return;
          this.target = new THREE.Vector3(tx, o.position.y, tz);
          this.targetYaw = yaw;
          this.state = 'gliding';
        });

        this.el.addEventListener('vertical-up', () => {
          if (!this.rig || this.state !== 'idle') return;
          if (!this.nearLadder()) {
            const hud = document.getElementById('hud');
            if (hud) { hud.setAttribute('text', 'value', 'walk to a ladder'); setTimeout(() => hud.setAttribute('text', 'value', ''), 1200); }
            return;
          }
          const o = this.rig.object3D;
          this.target = new THREE.Vector3(o.position.x, Math.min(o.position.y + this.data.tierMeters, 36), o.position.z);
          this.targetYaw = o.rotation.y; this.state = 'gliding';
        });
        this.el.addEventListener('vertical-down', () => {
          if (!this.rig || this.state !== 'idle') return;
          if (!this.nearLadder()) return;
          const o = this.rig.object3D;
          this.target = new THREE.Vector3(o.position.x, Math.max(0, o.position.y - this.data.tierMeters), o.position.z);
          this.targetYaw = o.rotation.y; this.state = 'gliding';
        });
      },
      nearLadder: function () {
        const o = this.rig.object3D.position;
        for (const id of ['ladder-a','ladder-b']) {
          const el = document.getElementById(id);
          if (!el) continue;
          const p = el.object3D.position;
          if (Math.hypot(p.x - o.x, p.z - o.z) < this.data.ladderReach) return true;
        }
        return false;
      },
      tick: function (t, dt) {
        if (this.state === 'idle' || !this.rig) return;
        const o = this.rig.object3D, s = dt / 1000;
        if (this.state === 'turning') {
          const d = Math.atan2(Math.sin(this.targetYaw - o.rotation.y), Math.cos(this.targetYaw - o.rotation.y));
          const step = this.data.turnSpeed * s;
          if (Math.abs(d) <= step) { o.rotation.y = this.targetYaw; this.state = 'gliding'; }
          else o.rotation.y += Math.sign(d) * step;
          return;
        }
        if (this.state === 'gliding') {
          const h = new THREE.Vector3(o.position.x, o.position.y, o.position.z);
          const to = new THREE.Vector3().subVectors(this.target, h);
          const dist = to.length(), step = this.data.speed * s;
          if (dist <= step) { o.position.set(this.target.x, this.target.y, this.target.z); this.state = 'idle'; return; }
          to.normalize().multiplyScalar(step);
          o.position.set(h.x + to.x, h.y + to.y, h.z + to.z);
        }
      }
    });
  </script>
