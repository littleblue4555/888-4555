<!-- lighthouse.html — v5.2b — 2026-09-23 — six items. Chair legs, descent, further climb,
     pitch unlocked, three gestures (+ two-finger), spiral entry (Option A), jar reach.
     Spiral center pulled to (3.0, -2.0); first step has open-floor approach.
     Gesture state machine upstream of tap-walk: single = walk, double = forward, long = crossing,
     two-finger tap top/bottom = up/down one tier.
     Count: 77 meshes (chair legs +4; spiral moved, not added). Skin reserved for v6. -->
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>4555 — Lighthouse (v5.2b)</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script>
    // JAR — accepts a line. Local-only. Count lives on the child a-text.
    // v5.2b — REACH: the jar only answers when the visitor is close enough to touch it.
    // The raycaster still aims at it from anywhere; the reach check gates the action.
    // Same shape as every threshold today — the crossing requires presence.
    AFRAME.registerComponent('jar', {
      schema: {
        reach: { default: 1.6 }   // meters — visitor must be within this of the jar to write
      },
      init: function () {
        this.lines = [];
        this.textEl = this.el.querySelector('a-text');
        this.el.addEventListener('click', () => {
          // Reach check first — if too far, do nothing.
          const rig = document.getElementById('rig');
          if (!rig) return;
          const jarPos = new THREE.Vector3();
          this.el.object3D.getWorldPosition(jarPos);
          const rigPos = rig.object3D.position;
          const dist = Math.hypot(jarPos.x - rigPos.x, jarPos.z - rigPos.z);
          if (dist > this.data.reach) return;   // too far. No prompt.

          const line = prompt('Write a line. Drop it in the jar.');
          if (line) {
            this.lines.push(line);
            if (this.textEl) {
              this.textEl.setAttribute('value', 'lines: ' + this.lines.length);
            }
            const paper = document.createElement('a-entity');
            paper.setAttribute('geometry', 'primitive: plane; width: 0.08; height: 0.11');
            paper.setAttribute('material', 'color: #f3e9c8; side: double');
            paper.setAttribute('position',
              (Math.random() - 0.5) * 0.08 + ' 0.02 ' +
              (Math.random() - 0.5) * 0.08);
            paper.setAttribute('rotation', '-90 0 ' + (Math.random() * 360));
            this.el.appendChild(paper);
          }
        });
        // Named, held. The pick-up verb lands when the arms do.
        this.el.addEventListener('deliberate-touch', () => { /* v5.4: pick up */ });
      }
    });

    // TOUCH-GATE — the room's touch gate, upstream of every click.
    // dragFraction is a fraction of the shorter screen dimension (screen-space,
    // because drag is a screen event). gesture-gate's doubleTapRadius is in
    // world-space meters, because it reads a 3D intersection point.
    // Two gates, two units — each matches the thing it measures.
    // v5.2b: also tracks touch duration for long-press (crossing) detection,
    // and two-finger taps (up/down one tier).
    AFRAME.registerComponent('touch-gate', {
      schema: {
        dragFraction: { default: 0.028 },
        longPressMs:  { default: 500 }   // press longer than this = crossing
      },
      init: function () {
        this.start = null;
        this.startTime = 0;
        this.moved = false;
        this.twoFinger = false;
        this.twoFingerStartY = 0;
        this.el.addEventListener('touchstart', (e) => {
          const t = e.touches[0];
          if (!t) return;
          this.start = { x: t.clientX, y: t.clientY };
          this.startTime = Date.now();
          this.moved = false;
          if (e.touches.length === 2) {
            this.twoFinger = true;
            this.twoFingerStartY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
          } else {
            this.twoFinger = false;
          }
        }, true);
        this.el.addEventListener('touchmove', (e) => {
          if (!this.start) return;
          const t = e.touches[0];
          if (!t) return;
          const dist = Math.hypot(t.clientX - this.start.x, t.clientY - this.start.y);
          const threshold = Math.min(window.innerWidth, window.innerHeight) * this.data.dragFraction;
          if (dist > threshold) this.moved = true;
        }, true);
        this.el.addEventListener('click', (e) => {
          if (!this.start) return;            // desktop mouse — nothing to guard
          // Two-finger tap → up/down one tier. Top half = up, bottom half = down.
          if (this.twoFinger && !this.moved) {
            e.stopPropagation();
            e.preventDefault();
            const half = window.innerHeight / 2;
            if (this.twoFingerStartY < half) {
              this.el.emit('vertical-up', { source: 'two-finger-tap' }, false);
            } else {
              this.el.emit('vertical-down', { source: 'two-finger-tap' }, false);
            }
            this.twoFinger = false;
            return;
          }
          // Long press → crossing. Block the click.
          if (!this.moved && (Date.now() - this.startTime) > this.data.longPressMs) {
            e.stopPropagation();
            e.preventDefault();
            this.el.emit('crossing', { source: 'long-press' }, false);
            return;
          }
          if (this.moved === true) {
            e.stopPropagation();
            e.preventDefault();
          }
        }, true);
        this.el.addEventListener('touchend', () => {
          this.start = null;
          setTimeout(() => { this.moved = false; this.twoFinger = false; }, 0);
        }, true);
      }
    });

    // GESTURE-GATE — separates single tap from double tap. Reads A-Frame's
    // synthesized `click`. Two-finger gestures are read in touch-gate, not here.
    // doubleTapRadius is in world-space meters (not px) — both taps are read
    // from e.detail.intersection.point (a 3D world point), not from screen coords.
    AFRAME.registerComponent('gesture-gate', {
      schema: {
        doubleTapMs:     { default: 300 },
        doubleTapRadius: { default: 0.6 }   // world-space meters
      },
      init: function () {
        this.lastTapTime = 0;
        this.lastTapPos = null;
        this.el.addEventListener('click', (e) => {
          const p = e.detail && e.detail.intersection && e.detail.intersection.point;
          if (!p) return;
          const now = Date.now();
          const elapsed = now - this.lastTapTime;
          const near = this.lastTapPos &&
            Math.hypot(p.x - this.lastTapPos.x, p.z - this.lastTapPos.z) < this.data.doubleTapRadius;
          if (elapsed < this.data.doubleTapMs && near) {
            e.stopPropagation();
            e.preventDefault();
            this.el.emit('forward', { source: 'double-tap' }, false);
            this.lastTapTime = 0;
            this.lastTapPos = null;
            return;
          }
          this.lastTapTime = now;
          this.lastTapPos = { x: p.x, z: p.z };
        }, true);
      }
    });

    // Tap-to-walk. Lives on the scene. The rig is a separate entity.
    //
    // THREE STATES — one at a time:
    //   idle / turning / gliding.
    //
    // v5.1 — CLIMBABLE: taps on .climbable carry the tapped y.
    // v5.2b — DESCENT: when rig.y > 0.5, taps on .walkable carry y=0 (down).
    //          FORWARD: `forward` event glides 2.5m in the rig's current facing.
    //          VERTICAL: `vertical-up` / `vertical-down` events move y by ±4 (one tier).
    //          CROSSING: `crossing` event is a no-op for now (no door/stairs wired yet).
    AFRAME.registerComponent('tap-walk', {
      schema: {
        radius:    { default: 8.0 },
        speed:     { default: 1.6 },
        turnSpeed: { default: 3.2 },
        forwardMeters: { default: 2.5 },
        tierHeight:    { default: 4.0 }
      },
      init: function () {
        this.rig = document.getElementById('rig');
        this.state = 'idle';
        this.target = null;
        this.targetYaw = 0;

        // Single tap → walk to point.
        this.el.addEventListener('click', (e) => {
          const p = e.detail && e.detail.intersection && e.detail.intersection.point;
          if (!p) return;
          const hitEl = e.detail.intersection.object && e.detail.intersection.object.el;
          if (hitEl && hitEl.classList && hitEl.classList.contains('clickable')) return;

          const isClimb = hitEl && hitEl.classList && hitEl.classList.contains('climbable');
          const rigY = this.rig ? this.rig.object3D.position.y : 0;
          const isFloor = hitEl && hitEl.classList && hitEl.classList.contains('walkable');
          const descending = isFloor && rigY > 0.5;

          const r = Math.hypot(p.x, p.z);
          const k = r > this.data.radius ? this.data.radius / r : 1;
          let y;
          if (isClimb)         y = p.y;
          else if (descending) y = 0;
          else                 y = 0;
          this.target = new THREE.Vector3(p.x * k, y, p.z * k);
          this.targetYaw = Math.atan2(this.target.x, this.target.z);
          this.state = 'turning';
          const reticle = document.getElementById('reticle');
          if (reticle) reticle.object3D.position.set(this.target.x, y + 0.02, this.target.z);
        });

        // Double tap → forward along current yaw.
        this.el.addEventListener('forward', () => {
          if (!this.rig) return;
          const obj = this.rig.object3D;
          const yaw = obj.rotation.y;
          const dx = Math.sin(yaw) * this.data.forwardMeters;
          const dz = Math.cos(yaw) * this.data.forwardMeters;
          const nx = obj.position.x + dx;
          const nz = obj.position.z + dz;
          const r = Math.hypot(nx, nz);
          const k = r > this.data.radius ? this.data.radius / r : 1;
          this.target = new THREE.Vector3(nx * k, obj.position.y, nz * k);
          this.targetYaw = yaw;
          this.state = 'gliding';
          const reticle = document.getElementById('reticle');
          if (reticle) reticle.object3D.position.set(this.target.x, this.target.y + 0.02, this.target.z);
        });

        // Two-finger tap top half → up one tier.
        this.el.addEventListener('vertical-up', () => {
          if (!this.rig) return;
          const obj = this.rig.object3D;
          this.target = new THREE.Vector3(obj.position.x, obj.position.y + this.data.tierHeight, obj.position.z);
          this.targetYaw = obj.rotation.y;
          this.state = 'gliding';
        });

        // Two-finger tap bottom half → down one tier (floor = 0).
        this.el.addEventListener('vertical-down', () => {
          if (!this.rig) return;
          const obj = this.rig.object3D;
          const ny = Math.max(0, obj.position.y - this.data.tierHeight);
          this.target = new THREE.Vector3(obj.position.x, ny, obj.position.z);
          this.targetYaw = obj.rotation.y;
          this.state = 'gliding';
        });

        // Crossing → reserved for doors and non-spiral stairs. No-op in v5.2b.
        this.el.addEventListener('crossing', () => { /* named, held */ });
      },
      tick: function (t, dt) {
        if (this.state === 'idle' || !this.rig) return;
        const obj = this.rig.object3D;
        const seconds = dt / 1000;

        if (this.state === 'turning') {
          const delta = Math.atan2(
            Math.sin(this.targetYaw - obj.rotation.y),
            Math.cos(this.targetYaw - obj.rotation.y)
          );
          const step = this.data.turnSpeed * seconds;
          if (Math.abs(delta) <= step) {
            obj.rotation.y = this.targetYaw;
            this.state = 'gliding';
          } else {
            obj.rotation.y += Math.sign(delta) * step;
          }
          return;
        }

        if (this.state === 'gliding') {
          const here = new THREE.Vector3(obj.position.x, obj.position.y, obj.position.z);
          const to = new THREE.Vector3().subVectors(this.target, here);
          const dist = to.length();
          const step = this.data.speed * seconds;
          if (dist <= step) {
            obj.position.set(this.target.x, this.target.y, this.target.z);
            this.state = 'idle';
            return;
          }
          to.normalize().multiplyScalar(step);
          obj.position.set(here.x + to.x, here.y + to.y, here.z + to.z);
        }
      }
    });
  </script>
  <style>
    html, body { margin: 0; height: 100%; background: #0a0a0f; touch-action: none; }
  </style>
