<!-- lighthouse.html — v5.2e — 2026-09-23 — walk + desk scene + fixed touch-gate. -->
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>4555 — Lighthouse (v5.2e)</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script>
    // JAR — accepts a line. Reach check deferred to v5.2f.
    AFRAME.registerComponent('jar', {
      init: function () {
        this.lines = [];
        this.textEl = this.el.querySelector('a-text');
        this.el.addEventListener('click', () => {
          const line = prompt('Write a line. Drop it in the jar.');
          if (!line) return;
          this.lines.push(line);
          if (this.textEl) this.textEl.setAttribute('value', 'lines: ' + this.lines.length);
          const p = document.createElement('a-entity');
          p.setAttribute('geometry', 'primitive: plane; width: 0.08; height: 0.11');
          p.setAttribute('material', 'color: #f3e9c8; side: double');
          p.setAttribute('position', (Math.random()-0.5)*0.08 + ' 0.02 ' + (Math.random()-0.5)*0.08);
          p.setAttribute('rotation', '-90 0 ' + Math.random()*360);
          this.el.appendChild(p);
        });
      }
    });

    // TOUCH-GATE — fixed. Reads movement at touchend, not on every touchmove.
    // A tap is a touch whose total travel stayed under the threshold until it lifted.
    AFRAME.registerComponent('touch-gate', {
      schema: { dragFraction: { default: 0.05 } },
      init: function () {
        this.start = null;
        this.maxDist = 0;
        this.el.addEventListener('touchstart', (e) => {
          const t = e.touches[0]; if (!t) return;
          this.start = { x: t.clientX, y: t.clientY };
          this.maxDist = 0;
        }, true);
        this.el.addEventListener('touchmove', (e) => {
          if (!this.start) return;
          const t = e.touches[0]; if (!t) return;
          const d = Math.hypot(t.clientX - this.start.x, t.clientY - this.start.y);
          if (d > this.maxDist) this.maxDist = d;
        }, true);
        this.el.addEventListener('click', (e) => {
          if (!this.start) return;
          const threshold = Math.min(window.innerWidth, window.innerHeight) * this.data.dragFraction;
          if (this.maxDist > threshold) {
            e.stopPropagation();
            e.preventDefault();
          }
          this.start = null;
          this.maxDist = 0;
        }, true);
        this.el.addEventListener('touchend', () => {
          setTimeout(() => { this.start = null; this.maxDist = 0; }, 0);
        }, true);
      }
    });

    // TAP-WALK — same as v5.2d probe. Tap the floor, glide to the point.
    AFRAME.registerComponent('tap-walk', {
      schema: { radius: { default: 8.0 }, speed: { default: 1.6 } },
      init: function () {
        this.rig = document.getElementById('rig');
        this.target = null;
        this.el.addEventListener('click', (e) => {
          const p = e.detail && e.detail.intersection && e.detail.intersection.point;
          if (!p) return;
          const h = e.detail.intersection.object && e.detail.intersection.object.el;
          if (h && h.classList && h.classList.contains('clickable')) return;
          const r = Math.hypot(p.x, p.z);
          const k = r > this.data.radius ? this.data.radius / r : 1;
          this.target = new THREE.Vector3(p.x * k, 0, p.z * k);
          const ret = document.getElementById('reticle');
          if (ret) ret.object3D.position.set(this.target.x, 0.02, this.target.z);
        });
      },
      tick: function (t, dt) {
        if (!this.target || !this.rig) return;
        const o = this.rig.object3D;
        const here = new THREE.Vector3(o.position.x, 0, o.position.z);
        const to = new THREE.Vector3().subVectors(this.target, here);
        const dist = to.length();
        const step = (this.data.speed * dt) / 1000;
        if (dist <= step) {
          o.position.set(this.target.x, 0, this.target.z);
          this.target = null;
          return;
        }
        to.normalize().multiplyScalar(step);
        o.position.set(here.x + to.x, 0, here.z + to.z);
      }
    });

    // SCENE-BUILDER — floor, marker, reticle, desk, chair, lamp, jar, props, rig.
    AFRAME.registerComponent('scene-builder', {
      init: function () {
        const add = (tag, attrs, parent) => {
          const e = document.createElement(tag);
          for (const k in attrs) e.setAttribute(k, attrs[k]);
          (parent || this.el).appendChild(e);
          return e;
        };

        add('a-entity', { light: 'type: ambient; color: #4a4038; intensity: 0.8' });
        add('a-entity', { light: 'type: point; color: #ffb066; intensity: 1.2; distance: 10', position: '0 2 -3' });

        // Floor
        add('a-circle', { radius: 9, rotation: '-90 0 0', position: '0 0 0', class: 'walkable',
                          material: 'color: #1d1814; roughness: 0.6; metalness: 0.2' });

        // Reticle
        add('a-ring', { id: 'reticle', 'radius-inner': 0.08, 'radius-outer': 0.12, rotation: '-90 0 0',
                        position: '0 0.02 1.6',
                        material: 'color: #ffe6b0; opacity: 0.7; transparent: true; side: double; depthWrite: false' });

        // Marker at origin — the witness. World stays, body moves.
        add('a-box', { position: '0 0.3 0', width: 0.4, height: 0.6, depth: 0.4,
                       material: 'color: #6b2b2b; roughness: 0.9' });

        // Desk
        add('a-box', { position: '0 0.75 -1.6', width: 1.4, height: 0.06, depth: 0.9,
                       material: 'color: #3a2a1c; roughness: 0.8' });
        for (const [x, z] of [[-0.6, -1.6], [0.6, -1.6], [-0.6, -1.2], [0.6, -1.2]]) {
          add('a-box', { position: `${x} 0.37 ${z}`, width: 0.08, height: 0.75, depth: 0.08,
                         material: 'color: #2a1e14' });
        }

        // Chair — seat, back, four legs
        add('a-box', { position: '0 0.45 -1.2', width: 0.5, height: 0.05, depth: 0.5,
                       material: 'color: #2a1e14; roughness: 0.9' });
        add('a-box', { position: '0 0.7 -1.0', width: 0.5, height: 0.5, depth: 0.05,
                       material: 'color: #2a1e14; roughness: 0.9' });
        for (const [x, z] of [[-0.2, -1.4], [0.2, -1.4], [-0.2, -1.0], [0.2, -1.0]]) {
          add('a-box', { position: `${x} 0.22 ${z}`, width: 0.06, height: 0.44, depth: 0.06,
                         material: 'color: #2a1e14' });
        }

        // Lamp
        const lamp = add('a-entity', { position: '-0.4 0.9 -1.35' });
        add('a-cylinder', { radius: 0.06, height: 0.18,
                            material: 'color: #d8b46a; metalness: 0.7; roughness: 0.3' }, lamp);
        add('a-sphere', { radius: 0.07, position: '0 0.16 0',
                          material: 'color: #ffcf80; emissive: #ffb060; emissiveIntensity: 1.4' }, lamp);
        add('a-entity', { light: 'type: point; color: #ffb060; intensity: 1.6; distance: 4',
                          position: '0 0.16 0' }, lamp);

        // Jar
        const jar = add('a-entity', { id: 'jar', jar: '', class: 'clickable', position: '0.25 0.82 -1.6',
          geometry: 'primitive: cylinder; radius: 0.09; height: 0.22',
          material: 'color: #cfe4ff; opacity: 0.35; transparent: true; roughness: 0.05; metalness: 0.1' });
        add('a-entity', { geometry: 'primitive: cylinder; radius: 0.1; height: 0.02',
                          position: '0 0.12 0',
                          material: 'color: #b8c8e0; metalness: 0.6' }, jar);
        add('a-text', { value: 'lines: 0', position: '0 0.3 0', align: 'center', width: 1,
                        color: '#ffe6b0', scale: '0.5 0.5 0.5' }, jar);

        // Pen, paper, book, 4555
        add('a-cylinder', { radius: 0.008, height: 0.16, rotation: '0 0 80',
                            position: '0.05 0.79 -1.5', material: 'color: #101010' });
        add('a-plane', { width: 0.22, height: 0.3, rotation: '-90 0 10',
                         position: '-0.15 0.785 -1.55', material: 'color: #f3e9c8' });
        add('a-box', { width: 0.18, height: 0.04, depth: 0.24, position: '0.05 0.79 -1.75',
                       rotation: '0 12 0', material: 'color: #6b2b2b' });
        add('a-text', { value: '4555', position: '0 0.79 -1.6', rotation: '-90 0 0', align: 'center',
                        color: '#c9a86a', width: 2, scale: '0.4 0.4 0.4' });

        // Rig
        const rig = add('a-entity', { id: 'rig', position: '0 0 1.6' });
        add('a-entity', { id: 'camera', camera: 'fov: 55',
                          'look-controls': 'magicWindowTrackingEnabled: false',
                          position: '0 1.6 0' }, rig);
      }
    });
  </script>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #0a0a0f;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>
<body>
  <a-scene
    scene-builder
    touch-gate="dragFraction: 0.05"
    tap-walk="radius: 8.0; speed: 1.6"
    background="color: #0a0a0f"
    cursor="rayOrigin: mouse"
    raycaster="objects: .walkable, .clickable"
    vr-mode-ui="enabled: true" xr-mode-ui="enabled: true">
  </a-scene>
</body>
</html>
