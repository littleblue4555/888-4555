<!-- look-test.html — 2026-09-23 — touch-only look. No look-controls. No gyro. Pitch + yaw by finger only.
     Open with ?v=1 to bust cache. -->
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Look Test</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script>
    // LOOK — touch-only yaw + pitch. No gyro. No roll. One finger owns the camera.
    AFRAME.registerComponent('look', {
      schema: {
        sensitivity: { default: 0.005 },   // radians per pixel
        limit:       { default: 1.48 }     // ~85° pitch clamp
      },
      init: function () {
        this.yaw = 0;
        this.pitch = 0;
        this.last = null;
        const cam = this.el.object3D;

        this.el.sceneEl.addEventListener('touchstart', (e) => {
          const t = e.touches[0];
          if (!t) return;
          this.last = { x: t.clientX, y: t.clientY };
        }, true);

        this.el.sceneEl.addEventListener('touchmove', (e) => {
          const t = e.touches[0];
          if (!t || !this.last) return;
          const dx = t.clientX - this.last.x;
          const dy = t.clientY - this.last.y;
          this.last = { x: t.clientX, y: t.clientY };

          this.yaw   -= dx * this.data.sensitivity;
          this.pitch -= dy * this.data.sensitivity;
          if (this.pitch >  this.data.limit) this.pitch =  this.data.limit;
          if (this.pitch < -this.data.limit) this.pitch = -this.data.limit;

          // Euler order YXZ: yaw first, pitch second, roll never.
          cam.rotation.order = 'YXZ';
          cam.rotation.y = this.yaw;
          cam.rotation.x = this.pitch;
          cam.rotation.z = 0;
        }, true);

        this.el.sceneEl.addEventListener('touchend', () => { this.last = null; }, true);
      }
    });
  </script>
  <style>
    html, body {
      margin: 0; height: 100%; background: #0a0a0f; touch-action: none;
      -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>
<body>
  <a-scene background="color: #0a0a0f" vr-mode-ui="enabled: true" xr-mode-ui="enabled: true">

    <a-entity light="type: ambient; color: #ffffff; intensity: 1"></a-entity>

    <a-circle radius="9" rotation="-90 0 0" position="0 0 0"
              material="color: #1d1814; roughness: 0.6"></a-circle>

    <a-box position="0 0.5 -3" width="0.5" height="1" depth="0.5"
           material="color: #6b2b2b"></a-box>

    <a-cylinder position="2 2 0" radius="0.05" height="4"
                material="color: #d8b46a"></a-cylinder>

    <a-box position="0 6 0" width="4" height="0.2" depth="4"
           material="color: #3a342c"></a-box>

    <!-- A second box behind you — if you turn 180° you should see it -->
    <a-box position="0 0.5 3" width="0.5" height="1" depth="0.5"
           material="color: #2a4a7a"></a-box>

    <!-- Rig — camera with look only. No look-controls. -->
    <a-entity id="rig" position="0 0 0">
      <a-entity id="camera" camera="fov: 70"
                look="sensitivity: 0.005; limit: 1.48"
                position="0 1.6 0"></a-entity>
    </a-entity>
  </a-scene>
</body>
</html>
