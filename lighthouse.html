      schema: { reach: { default: 1.6 } },
      init: function () {
        this.lines = [];
        this.textEl = this.el.querySelector('a-text');
        this.el.addEventListener('click', () => {
          const rig = document.getElementById('rig');
          if (!rig) return;
          const jarPos = new THREE.Vector3();
          this.el.object3D.getWorldPosition(jarPos);
          const rigPos = rig.object3D.position;
          const dist = Math.hypot(jarPos.x - rigPos.x, jarPos.z - rigPos.z);
          if (dist > this.data.reach) return;
          const line = prompt('Write a line. Drop it in the jar.');
          if (line) {
            this.lines.push(line);
            if (this.textEl) this.textEl.setAttribute('value', 'lines: ' + this.lines.length);
            const paper = document.createElement('a-entity');
            paper.setAttribute('geometry', 'primitive: plane; width: 0.08; height: 0.11');
            paper.setAttribute('material', 'color: #f3e9c8; side: double');
            paper.setAttribute('position',
              (Math.random() - 0.5) * 0.08 + ' 0.02 ' + (Math.random() - 0.5) * 0.08);
            paper.setAttribute('rotation', '-90 0 ' + (Math.random() * 360));
            this.el.appendChild(paper);
          }
        });
        this.el.addEventListener('deliberate-touch', () => {});
      }
    });

    AFRAME.registerComponent('touch-gate', {
      schema: { dragFraction: { default: 0.028 }, longPressMs: { default: 500 }, doubleTapMs: { default: 300 } },
      init: function () {
        this.start = null; this.startTime = 0; this.moved = false;
        this.touchCount = 0; this.twoFinger = false; this.twoFingerStartY = 0;
        this.el.addEventListener('touchstart', (e) => {
          this.touchCount = e.touches.length;
          if (e.touches.length === 2) {
            this.twoFinger = true;
            const a = e.touches[0], b = e.touches[1];
            this.twoFingerStartY = (a.clientY + b.clientY) / 2;
            this.startTime = Date.now(); this.moved = false;
            return;
          }
          const t = e.touches[0]; if (!t) return;
          this.start = { x: t.clientX, y: t.clientY };
          this.startTime = Date.now(); this.moved = false; this.twoFinger = false;
        }, true);
        this.el.addEventListener('touchmove', (e) => {
          if (this.twoFinger) { this.moved = true; return; }
          if (!this.start) return;
          const t = e.touches[0]; if (!t) return;
          const dist = Math.hypot(t.clientX - this.start.x, t.clientY - this.start.y);
          const threshold = Math.min(window.innerWidth, window.innerHeight) * this.data.dragFraction;
          if (dist > threshold) this.moved = true;
        }, true);
        this.el.addEventListener('touchend', (e) => {
          const elapsed = Date.now() - this.startTime;
          if (this.twoFinger && !this.moved && elapsed < this.data.doubleTapMs) {
            const topHalf = this.twoFingerStartY < window.innerHeight / 2;
            this.el.emit(topHalf ? 'vertical-up' : 'vertical-down', { source: 'two-finger-tap' }, false);
            this.twoFinger = false; this.start = null; return;
          }
          if (!this.twoFinger && !this.moved && this.start && elapsed >= this.data.longPressMs) {
            const hitEl = e.detail && e.detail.intersection && e.detail.intersection.object && e.detail.intersection.object.el;
            if (hitEl) hitEl.emit('deliberate-touch', { source: 'long-press' }, false);
            else this.el.emit('deliberate-touch', { source: 'long-press' }, false);
          }
          this.start = null; this.twoFinger = false; this.touchCount = 0;
          setTimeout(() => { this.moved = false; }, 0);
        }, true);
        this.el.addEventListener('click', (e) => {
          if (!this.start && !this.twoFinger && this.touchCount === 0) return;
          if (this.moved || this.twoFinger) { e.stopPropagation(); e.preventDefault(); return; }
          if (Date.now() - this.startTime >= this.data.longPressMs) { e.stopPropagation(); e.preventDefault(); }
        }, true);
      }
    });

    AFRAME.registerComponent('gesture-gate', {
      schema: { doubleTapMs: { default: 300 }, doubleTapRadius: { default: 0.6 } },
      init: function () {
        this.lastTapTime = 0; this.lastTapPos = null;
        this.el.addEventListener('click', (e) => {
          const p = e.detail && e.detail.intersection && e.detail.intersection.point;
          if (!p) return;
          const now = Date.now();
          const elapsed = now - this.lastTapTime;
          const near = this.lastTapPos &&
            Math.hypot(p.x - this.lastTapPos.x, p.z - this.lastTapPos.z) < this.data.doubleTapRadius;
          if (elapsed < this.data.doubleTapMs && near) {
            e.stopPropagation(); e.preventDefault();
            this.el.emit('forward', { source: 'double-tap' }, false);
            this.lastTapTime = 0; this.lastTapPos = null; return;
          }
          this.lastTapTime = now; this.lastTapPos = { x: p.x, z: p.z };
        }, true);
      }
    });

    AFRAME.registerComponent('tap-walk', {
      schema: { radius: { default: 8.0 }, speed: { default: 1.6 }, turnSpeed: { default: 3.2 },
                forwardMeters: { default: 2.5 }, tierMeters: { default: 4.0 } },
      init: function () {
        this.rig = document.getElementById('rig');
        this.state = 'idle'; this.target = null; this.targetYaw = 0;
        this.el.addEventListener('click', (e) => {
          const p = e.detail && e.detail.intersection && e.detail.intersection.point;
          if (!p) return;
          const hitEl = e.detail.intersection.object && e.detail.intersection.object.el;
          if (hitEl && hitEl.classList && hitEl.classList.contains('clickable')) return;
          const isClimb = hitEl && hitEl.classList && hitEl.classList.contains('climbable');
          const isFloor = hitEl && hitEl.classList && hitEl.classList.contains('walkable');
          const rigY = this.rig ? this.rig.object3D.position.y : 0;
          const descending = isFloor && rigY > 0.5;
          const r = Math.hypot(p.x, p.z);
          const k = r > this.data.radius ? this.data.radius / r : 1;
          let y;
          if (isClimb) y = p.y; else if (descending) y = 0; else y = 0;
          this.target = new THREE.Vector3(p.x * k, y, p.z * k);
          this.targetYaw = Math.atan2(this.target.x, this.target.z);
          this.state = 'turning';
          const reticle = document.getElementById('reticle');
          if (reticle) reticle.object3D.position.set(this.target.x, y + 0.02, this.target.z);
        });
        this.el.addEventListener('forward', () => {
          if (!this.rig) return;
          const obj = this.rig.object3D;
          const yaw = obj.rotation.y;
          const dx = Math.sin(yaw) * this.data.forwardMeters;
          const dz = Math.cos(yaw) * this.data.forwardMeters;
          const nx = obj.position.x + dx;
          const nz = obj.position.z + dz;
          const r = Math.hypot(nx, nz);
          const k = r > this.data.radius ? this.data.radius / r : 1;
          this.target = new THREE.Vector3(nx * k, obj.position.y, nz * k);
          this.targetYaw = yaw; this.state = 'gliding';
          const reticle = document.getElementById('reticle');
          if (reticle) reticle.object3D.position.set(this.target.x, this.target.y + 0.02, this.target.z);
        });
        this.el.addEventListener('vertical-up', () => {
          if (!this.rig) return;
          const obj = this.rig.object3D;
          const nextY = Math.min(obj.position.y + this.data.tierMeters, 36);
          this.target = new THREE.Vector3(obj.position.x, nextY, obj.position.z);
          this.targetYaw = obj.rotation.y; this.state = 'gliding';
          const reticle = document.getElementById('reticle');
          if (reticle) reticle.object3D.position.set(this.target.x, nextY + 0.02, this.target.z);
        });
        this.el.addEventListener('vertical-down', () => {
          if (!this.rig) return;
          const obj = this.rig.object3D;
          const nextY = Math.max(0, obj.position.y - this.data.tierMeters);
          this.target = new THREE.Vector3(obj.position.x, nextY, obj.position.z);
          this.targetYaw = obj.rotation.y; this.state = 'gliding';
          const reticle = document.getElementById('reticle');
          if (reticle) reticle.object3D.position.set(this.target.x, nextY + 0.02, this.target.z);
        });
      },
      tick: function (t, dt) {
        if (this.state === 'idle' || !this.rig) return;
        const obj = this.rig.object3D;
        const seconds = dt / 1000;
        if (this.state === 'turning') {
          const delta = Math.atan2(Math.sin(this.targetYaw - obj.rotation.y), Math.cos(this.targetYaw - obj.rotation.y));
          const step = this.data.turnSpeed * seconds;
          if (Math.abs(delta) <= step) { obj.rotation.y = this.targetYaw; this.state = 'gliding'; }
          else { obj.rotation.y += Math.sign(delta) * step; }
          return;
        }
        if (this.state === 'gliding') {
          const here = new THREE.Vector3(obj.position.x, obj.position.y, obj.position.z);
          const to = new THREE.Vector3().subVectors(this.target, here);
          const dist = to.length(); const step = this.data.speed * seconds;
          if (dist <= step) { obj.position.set(this.target.x, this.target.y, this.target.z); this.state = 'idle'; return; }
          to.normalize().multiplyScalar(step);
          obj.position.set(here.x + to.x, here.y + to.y, here.z + to.z);
        }
      }
    });
