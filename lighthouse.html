<!-- lighthouse.html — v5.2d — 2026-09-23 — walk probe. One floor, one rig, one tap-walk. -->
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>4555 — Walk Probe (v5.2d)</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script>
    // TAP-WALK — the smallest working walk. Tap the floor, glide to the point.
    AFRAME.registerComponent('tap-walk', {
      schema: { radius: { default: 8.0 }, speed: { default: 1.6 } },
      init: function () {
        this.rig = document.getElementById('rig');
        this.target = null;
        this.el.addEventListener('click', (e) => {
          const p = e.detail && e.detail.intersection && e.detail.intersection.point;
          if (!p) return;
          const r = Math.hypot(p.x, p.z);
          const k = r > this.data.radius ? this.data.radius / r : 1;
          this.target = new THREE.Vector3(p.x * k, 0, p.z * k);
          const ret = document.getElementById('reticle');
          if (ret) ret.object3D.position.set(this.target.x, 0.02, this.target.z);
        });
      },
      tick: function (t, dt) {
        if (!this.target || !this.rig) return;
        const o = this.rig.object3D;
        const here = new THREE.Vector3(o.position.x, 0, o.position.z);
        const to = new THREE.Vector3().subVectors(this.target, here);
        const dist = to.length();
        const step = (this.data.speed * dt) / 1000;
        if (dist <= step) {
          o.position.set(this.target.x, 0, this.target.z);
          this.target = null;
          return;
        }
        to.normalize().multiplyScalar(step);
        o.position.set(here.x + to.x, 0, here.z + to.z);
      }
    });
  </script>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #0a0a0f;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>
<body>
  <a-scene
    tap-walk="radius: 8.0; speed: 1.6"
    background="color: #0a0a0f"
    cursor="rayOrigin: mouse"
    raycaster="objects: .walkable"
    vr-mode-ui="enabled: true" xr-mode-ui="enabled: true">

    <a-entity light="type: ambient; color: #4a4038; intensity: 1"></a-entity>

    <!-- Floor — the only walkable surface -->
    <a-circle radius="9" rotation="-90 0 0" position="0 0 0" class="walkable"
              material="color: #1d1814; roughness: 0.6; metalness: 0.2"></a-circle>

    <!-- Reticle -->
    <a-ring id="reticle" radius-inner="0.08" radius-outer="0.12"
            rotation="-90 0 0" position="0 0.02 1.6"
            material="color: #ffe6b0; opacity: 0.7; transparent: true; side: double; depthWrite: false"></a-ring>

    <!-- A marker at origin so you can see the world didn't move, only you did -->
    <a-box position="0 0.3 0" width="0.4" height="0.6" depth="0.4"
           material="color: #6b2b2b; roughness: 0.9"></a-box>

    <!-- Rig — camera at eye height. No pitch changes, no gestures. -->
    <a-entity id="rig" position="0 0 1.6">
      <a-entity id="camera" camera="fov: 55"
                look-controls="magicWindowTrackingEnabled: false"
                position="0 1.6 0"></a-entity>
    </a-entity>
  </a-scene>
</body>
</html>
